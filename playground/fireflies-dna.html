<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireflies DNA · playground</title>
<style>
  /* The Fireflies look, as in src/server/public/agent-home.html. */
  :root {
    --field: #0B1410; --shadow: #060B08; --fly: #D8F26A;
    --text: #E6EEE8; --quiet: #8C9A90;
    --panel: #101A15; --line: #1E2B24; --line-on: #3A4A40;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--field); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 45%, var(--field) 0%, var(--field) 55%, var(--shadow) 100%) fixed;
    color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--fly); outline-offset: 3px; border-radius: 6px; }

  .app {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px;
    max-width: 960px; margin: 0 auto; padding: max(32px, 10vh) 32px 48px;
  }
  @media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 24px 16px 40px; } }

  /* The stage: the real thing (a home row), then the same cluster larger. */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 40px; min-width: 0; }
  .row {
    display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 14px;
    width: min(100%, 420px); height: 68px; padding: 0 14px 0 6px; border-radius: 14px;
  }
  .row:hover, .row:focus-within { background: rgba(16, 26, 21, .72); }
  .row canvas { width: 56px; height: 56px; display: block; }
  .row .text { min-width: 0; }
  .row .name {
    display: block; width: 100%; padding: 0; border: 0; background: none; outline: none;
    font-size: 17px; font-weight: 500; letter-spacing: .01em; line-height: 1.3; caret-color: var(--fly);
    text-overflow: ellipsis; border-radius: 4px;
  }
  .row .name:focus-visible { box-shadow: 0 0 0 2px rgba(216, 242, 106, .55); }
  .row .desc { display: block; font-size: 13px; color: var(--quiet); line-height: 1.4; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview { width: 224px; height: 224px; display: block; }

  .topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: -16px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--quiet); }
  .topics li { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* The panel: files, then dot size. */
  .panel { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); font-weight: 500; margin: 0 0 10px; }
  .files { list-style: none; margin: 0; padding: 0; }
  .files li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 32px; align-items: center; gap: 10px; height: 36px; font-size: 14px; }
  .files .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .files .fs { color: var(--quiet); font-size: 13px; font-variant-numeric: tabular-nums; }
  .x { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--quiet); }
  .x:hover, .x:focus-visible { color: var(--text); background: rgba(230, 238, 232, .06); }
  .x svg { width: 10px; height: 10px; }
  .quiet { margin: 0; color: var(--quiet); font-size: 13px; min-height: 20px; }

  .add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 12px; }
  .field {
    height: 40px; border-radius: 10px; border: 0; padding: 0 12px; font-size: 14px; min-width: 0;
    background: rgba(230, 238, 232, .075); box-shadow: inset 0 0 0 .5px rgba(230, 238, 232, .08); caret-color: var(--fly);
  }
  .field:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(216, 242, 106, .38); }
  .field::placeholder { color: var(--quiet); }
  .go { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--fly); color: var(--field); font-weight: 600; font-size: 14px; }
  .go:hover { filter: brightness(1.07); }
  .add .slide { grid-column: 1 / -1; }

  .slide { display: grid; grid-template-columns: 76px minmax(0, 1fr) 56px; align-items: center; gap: 12px; font-size: 13px; color: var(--quiet); }
  .slide + .slide { margin-top: 6px; }
  .slide input { width: 100%; margin: 0; height: 24px; accent-color: var(--fly); }
  .slide output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .note { margin-top: -28px; text-align: center; min-height: 0; }
  .note:empty { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="app">
  <section class="stage" aria-label="Cluster">
    <div class="row" id="row">
      <canvas id="avatar" data-role="avatar" aria-hidden="true"></canvas>
      <span class="text">
        <input class="name" id="agentName" type="text" value="Juniper" aria-label="Agent name" spellcheck="false" autocomplete="off">
        <span class="desc" id="desc"></span>
      </span>
    </div>
    <canvas class="preview" id="preview" data-role="preview" role="img"></canvas>
    <ul class="topics" id="topics" aria-label="Topic colours"></ul>
    <p class="quiet note" id="note"></p>
  </section>

  <aside class="panel">
    <section aria-labelledby="hFiles">
      <h2 id="hFiles">Files</h2>
      <ul class="files" id="files"></ul>
      <form class="add" id="add" autocomplete="off">
        <input class="field" id="fname" type="text" aria-label="File name, folder is the topic" placeholder="folder/file.md" spellcheck="false">
        <button class="go" type="submit">Add</button>
        <div class="slide"><label for="fsize">Size</label><input id="fsize" type="range" min="0" max="100" step="0.5"><output id="fsizeV" for="fsize"></output></div>
      </form>
      <p class="quiet" id="said" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="hSize">
      <h2 id="hSize">Dot size</h2>
      <div class="slide"><label for="minR">Smallest</label><input id="minR" type="range" min="2" max="9" step="0.25"><output for="minR"></output></div>
      <div class="slide"><label for="maxR">Largest</label><input id="maxR" type="range" min="2" max="9" step="0.25"><output for="maxR"></output></div>
    </section>
  </aside>
</main>

<script>
'use strict';
(function () {
const $ = s => document.querySelector(s);
const clock = () => performance.now();
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
const onMq = e => { reduced = e.matches; };
mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);

/* ---------- tools, as in agent-home.html ---------- */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const easeOut = x => 1 - (1 - x) * (1 - x);
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function fmtSize(b) {
  if (b < 1000) return Math.round(b) + ' B';
  const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
  do { b /= 1000; i++; } while (b >= 1000 && i < u.length - 1);
  return (b < 10 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
}

/* ---------- the cluster's rules ---------- */
const BOX = 56, MID = BOX / 2, LIMIT = [2, 9], GROW = 1.3;   // a flash grows a dot by up to 30 %
const MB = 1048576;            // one dot holds one MB
const FLOOR = 2;               // no dot is ever smaller than a 2 px radius
const PLACED = 60;             // up to 60 dots get their own spot; past that, a dot only adds glow
const TOUCH = .25;             // px of dark kept between two neighbouring dots at rest
/* The pace. A file's dots land one by one; the next file waits for the last dot of the one before. */
const STEP = 90, GAP = 250, PER_FILE = 2500;
/* The real firefly flash: rise 120 ms ease-out, fall 900 ms ease-in. */
function flash(dt) { if (dt < 0 || dt > 1020) return 0; if (dt < 120) return easeOut(dt / 120); const x = (dt - 120) / 900; return 1 - x * x; }
/* The golden-angle spiral. A slot's place doesn't depend on how many dots there are,
   so a new dot never moves the others (Columbo W1); only the zoom changes. */
function slot(i, seed) { const r = 10 * Math.sqrt(i + .5), t = i * 2.39996 + seed; return [Math.cos(t) * r, Math.sin(t) * r]; }

/* Fixed topic hue slots from the last FIREFLIES-DNA round, on its cool arc (110-280 deg). */
const FIRST_SLOTS = [0, .67, .33, 1, .5, .17, .83];
function topicColor(k) {
  const fr = k < FIRST_SLOTS.length ? FIRST_SLOTS[k] : (.15 + k * .6180339887) % 1;
  const h = 110 + 170 * (.06 + .88 * fr), blue = Math.max(0, 1 - Math.abs(h - 235) / 45);
  return hslHex(h, 85, Math.min(80, 66 + 6 * blue));
}
function hslHex(h, s, l) {
  s /= 100; l /= 100; const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
/* 1 dot per MB: dots = max(1, ceil(bytes / MB)). Every full dot holds 1 MB; the last one
   holds what is left, and its size says how full it is (area follows the bytes). */
const dotsFor = bytes => Math.max(1, Math.ceil(bytes / MB));
function fills(bytes) {
  const n = dotsFor(bytes), out = new Array(n).fill(1);
  out[n - 1] = bytes <= 0 ? 0 : Math.sqrt((bytes - (n - 1) * MB) / MB);
  return out;
}

/* ---------- state ---------- */
const S = { name: 'Juniper', min: 2.5, max: 6 };
let files = [];                       // { id, name, bytes, topic, dots: [{ fill, slot, litAt, flashT, seedA, seedB, rs }] }
const topicSlot = new Map();          // topic → hue slot, in order of first appearance; never reassigned
function slotOf(topic) { if (!topicSlot.has(topic)) topicSlot.set(topic, topicSlot.size); return topicSlot.get(topic); }
function colorOf(topic) { return topicColor(slotOf(topic)); }
const allDots = () => files.flatMap(f => f.dots.map(d => (d.f = f, d)));
const lit = () => allDots().filter(d => d.litAt != null);
function freeSlot() { const used = new Set(allDots().map(d => d.slot)); let i = 0; while (used.has(i)) i++; return i < PLACED ? i : null; }
/* After a removal, glow-only dots take the freed spots, oldest first. */
function refillSlots() { for (const d of lit().sort((a, b) => a.litAt - b.litAt)) if (d.slot == null) { const s = freeSlot(); if (s == null) break; d.slot = s; } }

/* The agent's own look, from its name only: spiral turn, outline, tilt and beat. */
let look = null;
function makeLook() {
  const r = rng(hash(S.name.trim() || 'Untitled'));
  look = { seed: r() * 6.28, squash: .8 + r() * .12, tilt: r() * 6.28, period: 2.4 + r(), lastFlash: -1e9 };
  look.master = 1 - .4 / look.period;   // the first beat lands 400 ms in, so a new look is seen lit, not dark
}

/* ---------- the queue: files light in the order they were added ---------- */
const queue = [];                     // files waiting, oldest first
let cur = null;                       // { f, i, step, gap, at }: the file lighting now
let nextStart = -1e9;                 // the earliest moment the next file may start (after the gap)
let quietUntil = -1e9;                // the beat rests while files arrive, so the pace is all you see
const litLog = [];                    // [{ fileId, litAt }] in the order dots lit
function tick(now) {
  let changed = false;
  for (;;) {
    if (!cur) {
      if (!queue.length) break;
      const f = queue.shift(), n = f.dots.length;
      // A long queue (more than 3 files waiting) hurries: shorter steps and gaps, but every file still lights, in order.
      const hurry = Math.max(.12, 1 / (1 + Math.max(0, queue.length - 3) / 2));
      cur = { f, i: 0, step: Math.min(STEP, (PER_FILE - 100) / Math.max(1, n - 1)) * hurry, gap: Math.max(24, GAP * hurry), at: Math.max(nextStart, f.queuedAt) };
    }
    if (cur.at > now) break;
    const f = cur.f;
    if (reduced) {                    // one quiet step per file: every dot in the same frame
      f.dots.forEach((d, k) => lightDot(f, d, cur.at + k * 1e-3));
      cur.i = f.dots.length;
    } else { lightDot(f, f.dots[cur.i], cur.at); cur.i++; }
    changed = true;
    if (cur.i >= f.dots.length) { const end = f.dots[f.dots.length - 1].litAt; nextStart = end + cur.gap; quietUntil = end + 1500; cur = null; }
    else cur.at += cur.step;
  }
  if (changed) { relayout(); render(); }
}
function lightDot(f, d, at) { d.litAt = at; d.flashT = at; d.slot = freeSlot(); litLog.push({ fileId: f.id, litAt: at }); }
const queueIdle = () => !cur && !queue.length;

/* ---------- where every dot rests ----------
   Up to 12 dots: the user's size range. Above 12: size × sqrt(12 / N). Then, if neighbours
   would touch or the cluster would leave the 56 px box, every dot shrinks toward the 2 px
   floor together (big stays bigger). Up to 60 dots keep a spot; more only add glow. */
let layout = { scale: .6, pts: new Map(), glow: [] };
function baseR(d) { return S.min + (S.max - S.min) * d.fill; }
function relayout() {
  const placed = lit().filter(d => d.slot != null), N = placed.length;
  const sq = 1 - (1 - look.squash) * Math.min(1, Math.pow(12 / Math.max(1, N), 2));   // dense clusters round out to keep their spacing
  const cs = Math.cos(look.tilt), sn = Math.sin(look.tilt), k = N > 12 ? Math.sqrt(12 / N) : 1;
  const P = placed.map(d => {
    const [u, v0] = slot(d.slot, look.seed), v = v0 * sq;
    return { d, ux: u * cs - v * sn, uy: u * sn + v * cs, r0: Math.max(FLOOR, baseR(d) * k) };
  });
  let scale = .62, q = 1;
  for (let it = 0; it < 80; it++) {
    const r = p => FLOOR + (p.r0 - FLOOR) * q;
    let sBox = Infinity, sNeed = 0;
    for (const p of P) { const far = Math.hypot(p.ux, p.uy); if (far > 0) sBox = Math.min(sBox, (MID - 1 - GROW * r(p)) / far); }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const du = Math.hypot(P[i].ux - P[j].ux, P[i].uy - P[j].uy);
      sNeed = Math.max(sNeed, (r(P[i]) + r(P[j]) + TOUCH) / du);
    }
    if (sNeed <= sBox || q === 0) { scale = Math.max(sNeed, Math.min(.62, sBox)); if (sNeed > sBox) scale = sBox; break; }
    q = q < .02 ? 0 : q * .94;
  }
  const pts = new Map();
  for (const p of P) pts.set(p.d, { ux: p.ux, uy: p.uy, r: FLOOR + (p.r0 - FLOOR) * q });
  // Glow: one soft light per topic, by how many extra MB it holds. Steady, capped, never a pulse.
  const extra = new Map(); let E = 0;
  for (const d of lit()) if (d.slot == null) { E++; extra.set(d.f.topic, (extra.get(d.f.topic) || 0) + 1); }
  const level = E ? Math.min(.3, .06 * Math.log2(1 + E)) : 0;
  layout = { scale, pts, glow: [...extra].map(([tp, n]) => ({ color: colorOf(tp), a: level * n / E })), extra: E };
}
function restingDot(d) { const p = layout.pts.get(d); return { x: MID + p.ux * layout.scale, y: MID + p.uy * layout.scale, r: p.r }; }

/* ---------- drawing ---------- */
const sprites = new Map();
function spriteOf(hex) {
  let s = sprites.get(hex); if (s) return s;
  const n = parseInt(hex.slice(1), 16), rgb = `${n >> 16},${(n >> 8) & 255},${n & 255}`;
  const core = `rgb(${(n >> 16) + (255 - (n >> 16)) * .7 | 0},${((n >> 8) & 255) + (255 - ((n >> 8) & 255)) * .7 | 0},${(n & 255) + (255 - (n & 255)) * .7 | 0})`;
  s = document.createElement('canvas'); s.width = s.height = 128; const g = s.getContext('2d');
  // A brighter core and a shorter glow than the home sprite, so neighbouring topics don't blend to white at 56 px.
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, core); gr.addColorStop(.18, `rgba(${rgb},.9)`); gr.addColorStop(.42, `rgba(${rgb},.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); sprites.set(hex, s); return s;
}

const avatar = $('#avatar'), preview = $('#preview');
const actx = avatar.getContext('2d'), pctx = preview.getContext('2d');
let DPR = 1, shown = layout.scale;
function fitCanvas(cv, css) { const px = Math.round(css * DPR); if (cv.width !== px) { cv.width = cv.height = px; } }

function draw(ctx, k, list) {
  ctx.setTransform(DPR * k, 0, 0, DPR * k, 0, 0); ctx.clearRect(0, 0, BOX, BOX);
  ctx.globalCompositeOperation = 'lighter';
  for (const d of list) { ctx.globalAlpha = d.a; ctx.drawImage(d.img, d.x - d.s / 2, d.y - d.s / 2, d.s, d.s); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

let last = clock();
function frame(t) {
  tick(t);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  fitCanvas(avatar, BOX); fitCanvas(preview, BOX * 4);
  const ease = reduced ? 1 : Math.min(1, dt * 6);
  shown += (layout.scale - shown) * ease;                                    // a zoom, never a reshuffle

  // The beat: all lit dots flash together, as in the home row. It rests while files arrive.
  let beat = false;
  if (!reduced) { look.master += dt / look.period; if (look.master >= 1) { look.master -= 1; if (queueIdle() && t >= quietUntil) { beat = true; look.lastFlash = t; } } }
  const list = [];
  for (const g of layout.glow) list.push({ x: MID, y: MID, s: BOX - 4, a: g.a, img: spriteOf(g.color) });
  for (const [d, p] of layout.pts) {
    d.rs = d.rs == null ? p.r : d.rs + (p.r - d.rs) * ease;
    const age = t - d.litAt;
    let ux = p.ux, uy = p.uy, a, s;
    if (reduced) {
      a = age < 1200 ? 1 : .75; s = 2 * d.rs;                                 // a new file simply appears, lit for a moment
    } else {
      if (age < 300) { const m = 1.25 - .25 * easeOut(age / 300); ux *= m; uy *= m; }   // a dot lands: from just outside, in 300 ms
      else if (beat && age > 1200) d.flashT = t + d.seedA * 4;                // up to ~25 ms apart, like the real thing
      ux += Math.sin(t / 8000 * 6.283 + d.seedA) * 1.5; uy += Math.cos(t / 8000 * 6.283 + d.seedB) * 1.5;
      const b = flash(t - d.flashT);
      a = .12 + .8 * b; s = 2 * d.rs * (1 + (GROW - 1) * b);
    }
    list.push({ x: MID + ux * shown, y: MID + uy * shown, s, a, img: spriteOf(colorOf(d.f.topic)) });
  }
  draw(actx, 1, list); draw(pctx, 4, list);
  requestAnimationFrame(frame);
}

/* ---------- files ---------- */
function topicFromName(name) { const i = name.indexOf('/'); return i > 0 ? name.slice(0, i).trim().toLowerCase() : 'other'; }
function makeFile(o, now) {
  const name = String(o && o.name || '').trim();
  const bytes = Math.max(0, +(o && (o.sizeBytes != null ? o.sizeBytes : o.bytes)) || 0);
  const id = String(o && o.id != null && o.id !== '' ? o.id : name);
  if (!name || files.some(f => f.id === id)) return null;
  const topic = String(o.topic == null || o.topic === '' ? topicFromName(name) : o.topic).trim().toLowerCase();
  const dots = fills(bytes).map((fill, k) => { const j = rng(hash('fly:' + id + ':' + k)); return { fill, slot: null, litAt: null, flashT: -1e9, seedA: j() * 6.28, seedB: j() * 6.28 }; });
  slotOf(topic);
  return { id, name, bytes, topic, dots, queuedAt: now };
}
/* Files join the end of the queue, in the order given. The first dot of an idle queue lights at once. */
function addFiles(list) {
  const now = clock(); let n = 0;
  for (const o of [].concat(list || [])) { const f = makeFile(o, now); if (!f) continue; files.push(f); queue.push(f); n++; }
  if (n) { render(); tick(now); }
  return n;
}
function addFile(o) { if (!o || files.some(f => f.name === String(o.name || '').trim())) return false; return addFiles([o]) === 1; }
function removeFile(key) {
  const i = files.findIndex(f => f.id === key || f.name === key); if (i < 0) return false;
  const f = files[i];
  files.splice(i, 1);                                                         // goes at once: no magic on deletion
  const qi = queue.indexOf(f); if (qi >= 0) queue.splice(qi, 1);
  if (cur && cur.f === f) { const done = f.dots.filter(d => d.litAt != null); nextStart = done.length ? done[done.length - 1].litAt + cur.gap : nextStart; cur = null; }
  refillSlots(); relayout(); render();
  return true;
}
function setSizeRange(a, b) {
  a = +a; b = +b;
  if (!isFinite(a)) a = S.min; if (!isFinite(b)) b = S.max;
  if (a > b) { const t = a; a = b; b = t; }                                 // they can never cross
  S.min = clamp(a, LIMIT[0], LIMIT[1]); S.max = clamp(b, LIMIT[0], LIMIT[1]);
  relayout(); syncSize();
  return { min: S.min, max: S.max };
}

/* ---------- the page ---------- */
const X = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function render() {
  const ul = $('#files'); ul.textContent = '';
  for (const f of files) {
    const li = document.createElement('li');
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = colorOf(f.topic);
    const fn = document.createElement('span'); fn.className = 'fn'; fn.textContent = f.name; fn.title = f.name;
    const fs = document.createElement('span'); fs.className = 'fs'; fs.textContent = fmtSize(f.bytes);
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.innerHTML = X;
    x.setAttribute('aria-label', 'Remove ' + f.name);
    x.addEventListener('click', () => {
      const i = [...ul.children].indexOf(li);
      removeFile(f.id); say('Removed ' + f.name);
      const b = ul.children[Math.min(i, ul.children.length - 1)];           // keep the keyboard in the list
      (b ? b.querySelector('.x') : $('#fname')).focus();
    });
    li.append(sw, fn, fs, x); ul.appendChild(li);
  }
  const counts = new Map(); files.forEach(f => counts.set(f.topic, (counts.get(f.topic) || 0) + 1));
  const tl = $('#topics'); tl.textContent = '';
  [...counts.keys()].sort((a, b) => slotOf(a) - slotOf(b)).forEach(tp => {
    const li = document.createElement('li'), sw = document.createElement('span');
    sw.className = 'sw'; sw.style.background = colorOf(tp);
    li.append(sw, tp + ' ' + counts.get(tp)); tl.appendChild(li);
  });
  const nf = files.length, nt = counts.size, nd = lit().length;
  $('#desc').textContent = nf ? `${nf} file${nf === 1 ? '' : 's'} · ${nt} topic${nt === 1 ? '' : 's'}` : 'No files yet';
  $('#note').textContent = layout.extra ? `Past ${PLACED} dots, each extra MB adds glow instead of a dot.` : '';
  preview.setAttribute('aria-label', `${S.name.trim() || 'Untitled'}’s cluster: ${nd ? `${nd} light${nd === 1 ? '' : 's'} in ${nt} topic colour${nt === 1 ? '' : 's'}` : 'no lights yet'}`);
}
let sayTimer = 0;
function say(s) { const p = $('#said'); p.textContent = s; clearTimeout(sayTimer); sayTimer = setTimeout(() => { p.textContent = ''; }, 4000); }

/* Add: the name field always holds a suggestion, so Add works on the first press.
   Size slider: 100 B … 100 MB on a log scale (100 MB = 96 dots, enough to see the glow rule). */
const IDEAS = [
  ['travel/packing-list.txt', 30], ['recipes/pear-tart-notes.md', 20], ['garden/orchard-photos.zip', 80],
  ['letters/birthday-cards.pdf', 60], ['travel/map-scans.pdf', 72], ['recipes/spice-list.csv', 15],
  ['garden/pond-plan.pdf', 64], ['letters/pen-pal-1984.txt', 25]
];
let ideaN = 0;
const bytesOf = v => Math.round(Math.pow(10, 2 + v / 100 * 6));
function showBytes() { $('#fsizeV').textContent = fmtSize(bytesOf(+$('#fsize').value)); }
function suggest() {
  for (let k = 0; k < IDEAS.length; k++) {
    const [n, v] = IDEAS[(ideaN + k) % IDEAS.length];
    if (!files.some(f => f.name === n)) { ideaN += k + 1; $('#fname').value = n; $('#fsize').value = v; showBytes(); return; }
  }
  $('#fname').value = ''; showBytes();
}
$('#fsize').addEventListener('input', showBytes);
$('#add').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#fname').value.trim();
  if (!name) { $('#fname').focus(); return; }
  if (!addFile({ name, bytes: bytesOf(+$('#fsize').value) })) { say(name + ' is already here'); return; }
  say('Added ' + name); suggest();
});

/* Dot size: two sliders that push each other, so the smallest is never above the largest. */
const minEl = $('#minR'), maxEl = $('#maxR');
function syncSize() {
  minEl.value = S.min; maxEl.value = S.max;
  minEl.nextElementSibling.textContent = S.min.toFixed(2).replace(/0$/, '') + ' px';
  maxEl.nextElementSibling.textContent = S.max.toFixed(2).replace(/0$/, '') + ' px';
}
minEl.addEventListener('input', () => { const v = +minEl.value; setSizeRange(v, Math.max(v, S.max)); });
maxEl.addEventListener('input', () => { const v = +maxEl.value; setSizeRange(Math.min(v, S.min), v); });

/* The name is the seed: each agent's cluster looks like its own. */
$('#agentName').addEventListener('input', e => { S.name = e.target.value; makeLook(); relayout(); render(); });

/* ---------- the test hook (Eraser) ---------- */
const q2 = v => Math.round(v * 100) / 100;
window.dna = {
  getFiles: () => files.map(f => ({ id: f.id, name: f.name, bytes: f.bytes, topic: f.topic, dots: f.dots.length })),
  addFile,                            // {name, bytes, topic?} -> true, or false for an empty or duplicate name
  addFiles,                           // [{id, name, sizeBytes}] -> how many were queued (a duplicate id is skipped)
  removeFile,                         // by id or name
  setSizeRange,
  getSizeRange: () => ({ min: S.min, max: S.max }),
  dotCount: () => files.reduce((s, f) => s + f.dots.length, 0),
  litOrder: () => litLog.map(e => ({ fileId: e.fileId, litAt: e.litAt })),
  queueIdle: () => { tick(clock()); return queueIdle(); },
  // Lit dots that have a spot (at most 60), resting positions in avatar px.
  getDots: () => [...layout.pts.keys()].map(d => { const p = restingDot(d); return { fileId: d.f.id, x: q2(p.x), y: q2(p.y), r: q2(p.r), color: colorOf(d.f.topic), topic: d.f.topic }; })
};

/* ---------- start: a sample agent (about 12 MB, 12 dots), same on every reload, already lit ---------- */
makeLook();
[
  ['recipes/plum-cake-draft.txt', 3200], ['recipes/grandmas-soup-scan.pdf', 2.4e6],
  ['letters/to-aunt-ida.md', 6100], ['letters/postcards-1998.zip', 9e5],
  ['garden/seed-list.csv', 900], ['garden/rose-bed-photos.zip', 2.8e6],
  ['recipes/bread-notes.md', 14000], ['travel/rail-trip-notes.md', 12000]
].forEach(([name, bytes]) => { const f = makeFile({ name, bytes }, -1e9); files.push(f); f.dots.forEach(d => { d.litAt = -1e9; d.slot = freeSlot(); }); });
relayout(); render();
shown = layout.scale;
syncSize(); suggest();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
