<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Creator</title>
<style>
  /* The Fireflies look, copied from glade-fireflies.html (left untouched). */
  :root {
    --field: #0B1410; --shadow: #060B08; --fly: #D8F26A;
    --text: #E6EEE8; --quiet: #8C9A90; --ember: #E89A4A;
    --panel: #101A15; --line: #1E2B24;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --col: min(560px, calc(100vw - 48px));
  }
  * { box-sizing: border-box; }
  html { background: var(--field); }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 45%, var(--field) 0%, var(--field) 55%, var(--shadow) 100%) fixed;
    color: var(--text); font: 15px/1.5 var(--font); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#field { position: fixed; inset: 0; display: block; }
  :focus-visible { outline: 2px solid var(--fly); outline-offset: 3px; border-radius: 6px; }

  /* The list: every agent, newest first, one line each. */
  .list {
    position: fixed; left: 24px; top: 24px; bottom: 92px; width: var(--col);
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .list.appear { animation: appear 160ms cubic-bezier(.5, 1, .89, 1) both; }
  @keyframes appear { from { opacity: 0; } }
  .list ol { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: baseline; gap: 14px; min-width: 0;
    padding: 10px 14px; border-radius: 10px; color: inherit; text-decoration: none; white-space: nowrap;
  }
  .row:hover { background: rgba(16, 26, 21, .72); }
  .row .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 20px; font-weight: 500; letter-spacing: .01em; }
  .row .desc { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--quiet); }
  .quiet-line { margin: 0; padding: 10px 14px; color: var(--quiet); overflow-wrap: anywhere; }

  /* The search row, with the plus beside it. Always at the bottom. */
  .find { position: fixed; left: 24px; bottom: 24px; width: var(--col); display: flex; gap: 10px; }
  .find input {
    flex: 1; min-width: 0; height: 44px; padding: 0 14px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
  }
  .find input::placeholder { color: var(--quiet); }
  .find input:focus-visible { outline-offset: 0; border-radius: 10px; }
  .plus {
    flex: 0 0 44px; height: 44px; display: grid; place-items: center; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); color: var(--quiet);
    transition: color 120ms cubic-bezier(.5, 1, .89, 1);
  }
  .plus:hover, .plus:focus-visible { color: var(--fly); }
  .plus:focus-visible { border-radius: 10px; }
  .plus svg { width: 18px; height: 18px; }
  body.leaving { pointer-events: none; }
  body.calling .plus { color: #F6FFD6; border-color: #F6FFD6; box-shadow: 0 0 18px rgba(216, 242, 106, .45); }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<main>
  <nav class="list" id="list" aria-label="Agents">
    <ol id="rows"></ol>
    <p class="quiet-line" id="quiet" role="status" aria-live="polite"></p>
  </nav>
  <form class="find" id="find" role="search" onsubmit="return false">
    <input id="q" type="search" placeholder="Search" aria-label="Search agents" autocomplete="off" spellcheck="false" autofocus>
    <a class="plus" id="plus" href="/new" aria-label="New agent" title="New agent">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
  </form>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const clock = () => performance.now();
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
const onMq = e => { reduced = e.matches; };
mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const easeOut = x => 1 - (1 - x) * (1 - x);
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------- Agents: newest first, filtered on every letter ---------- */
let agents = [], loaded = false, failed = false;
const nameOf = a => (a.draft && a.draft.name || '').trim() || 'Untitled';
const descOf = a => (a.draft && a.draft.description || '').trim();
const fold = s => s.toLocaleLowerCase();

function render() {
  const q = $('#q').value.trim(), f = fold(q);
  const shown = f ? agents.filter(a => fold(nameOf(a)).includes(f) || fold(descOf(a)).includes(f)) : agents;
  const ol = $('#rows'); ol.textContent = '';
  for (const a of shown) {
    const li = document.createElement('li'), row = document.createElement('a');
    row.className = 'row'; row.href = '/agents/' + encodeURIComponent(a.id); row.title = nameOf(a);
    const n = document.createElement('span'); n.className = 'name'; n.textContent = nameOf(a); row.appendChild(n);
    const d = descOf(a);
    if (d) { const s = document.createElement('span'); s.className = 'desc'; s.textContent = d; row.appendChild(s); row.title += ' · ' + d; }
    row.addEventListener('pointerenter', () => world.notice(a));
    row.addEventListener('focus', () => world.notice(a));
    li.appendChild(row); ol.appendChild(li);
  }
  const quiet = $('#quiet');
  quiet.textContent = !loaded ? '' : failed ? 'Couldn’t load your agents' : !agents.length ? 'No agents yet' : !shown.length ? `Nothing matches “${q}”` : '';
  quiet.hidden = !quiet.textContent;
}
$('#q').addEventListener('input', render);

async function load() {
  try {
    const r = await fetch('/api/agents'); if (!r.ok) throw new Error(r.status);
    agents = (await r.json()).slice().sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  } catch { failed = true; }
  loaded = true;
  if (!reduced) $('#list').classList.add('appear');
  render(); layout();
}

/* ============================================================
   Glade world, as in glade-fireflies.html: one cluster per agent,
   flashing as one, behind and to the right of the list.
   ============================================================ */
const cv = $('#field'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function sprite(rgb, core) {
  const s = document.createElement('canvas'); s.width = s.height = 64; const g = s.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, core); gr.addColorStop(.12, `rgba(${rgb},.85)`); gr.addColorStop(.32, `rgba(${rgb},.25)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const FLY = sprite('216,242,106', 'rgba(246,255,214,1)');

/* The real firefly flash: rise 120 ms ease-out, fall 900 ms ease-in. */
function flash(dt) { if (dt < 0 || dt > 1020) return 0; if (dt < 120) return easeOut(dt / 120); const x = (dt - 120) / 900; return 1 - x * x; }

const MAX_CLUSTERS = 12;   // the newest twelve light the glade; more would be noise, not a glade
const clusters = new Map();
function cluster(a) {
  let c = clusters.get(a.id); if (c) return c;
  const r = rng(hash(nameOf(a) + a.id));
  c = { a, cx: 0, cy: 0, scale: 1, alpha: 1, period: 2.4 + r(), master: r(), lastFlash: -1e9, seed: r() * 6.28, pts: [] };
  const n = 14 + Math.floor(r() * 16), R = radius(n);
  for (let i = 0; i < n; i++) {
    const [sx, sy] = slot(i, n, R, c.seed);
    c.pts.push({ sx, sy, flashT: -1e9, seedA: r() * 6.28, seedB: r() * 6.28 });
  }
  clusters.set(a.id, c); return c;
}
function slot(i, n, R, seed) { const r = R * Math.sqrt((i + .5) / n), t = i * 2.39996 + seed; return [Math.cos(t) * r, Math.sin(t) * r * .86]; }
function radius(n) { return 22 + 8 * Math.sqrt(n); }
const world = {
  notice(a) { const c = clusters.get(a.id), t = clock(); if (!c || reduced || t - c.lastFlash < 700) return; c.pts.forEach(p => { p.flashT = t; }); c.lastFlash = t; },
};
function visible() { return agents.slice(0, MAX_CLUSTERS).map(cluster); }

/* The original home grid, placed in the open field right of the list. */
function layout() {
  const left = Math.min(W * .6, $('#list').getBoundingClientRect().right + 24), FW = W - left;
  const list = visible(), n = list.length; if (!n) return;
  const cols = Math.max(1, Math.min(n, Math.floor(FW / 230))), rows = Math.ceil(n / cols);
  const cellH = Math.min(300, H / rows), sc = clamp(Math.min(FW / cols, cellH) / 230, .5, 1);
  list.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols);
    c.cx = left + FW / 2 + (col - (inRow - 1) / 2) * Math.min(260, FW / cols);
    c.cy = H / 2 + (row - (rows - 1) / 2) * cellH; c.scale = sc;
  });
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  layout();
}
addEventListener('resize', resize);

let last = clock();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const c of visible()) drawCluster(c, t, dt);
  drawSpark(t);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
function drawCluster(c, t, dt) {
  c.master += dt / c.period;
  let beat = false; if (c.master >= 1) { c.master -= 1; beat = true; c.lastFlash = t; }
  for (const p of c.pts) {
    if (!reduced && beat) p.flashT = t + (p.seedA * 4);               // up to ~25 ms apart, like the real thing
    let x = p.sx, y = p.sy;
    if (!reduced) { x += Math.sin(t / 8000 * 6.283 + p.seedA) * 1.5; y += Math.cos(t / 8000 * 6.283 + p.seedB) * 1.5; }
    let b, alpha, size;
    if (reduced) { b = 0; alpha = .85; size = 24; }
    else { b = flash(t - p.flashT); alpha = .1 + .8 * b; size = 18 + 12 * b; }
    const s = size * (c.scale < 1 ? .8 : c.scale);
    ctx.globalAlpha = alpha * c.alpha; ctx.drawImage(FLY, c.cx + x * c.scale - s / 2, c.cy + y * c.scale - s / 2, s, s);
  }
}

/* ---------- The plus: a firefly's call (02-merlin-motion.md §2) ---------- */
const outQuad = 'cubic-bezier(.5, 1, .89, 1)', inQuad = 'cubic-bezier(.11, 0, .5, 0)';
let call = null;   // { t0, p0, timer }
function go() { location.assign('/new'); }
function drawSpark(t) {
  if (!call) return;
  const k = clamp((t - call.t0 - 60) / 420, 0, 1); if (t - call.t0 < 60) return;
  const P0 = call.p0, P3 = { x: W / 2, y: H * .36 }, dx = P3.x - P0.x, dy = P3.y - P0.y;
  const C1 = { x: P0.x + .10 * dx, y: P0.y + 14 }, C2 = { x: P3.x - .35 * dx, y: P3.y - .25 * dy };
  const u = easeInOut(k), v = 1 - u;
  const x = v * v * v * P0.x + 3 * v * v * u * C1.x + 3 * v * u * u * C2.x + u * u * u * P3.x;
  const y = v * v * v * P0.y + 3 * v * v * u * C1.y + 3 * v * u * u * C2.y + u * u * u * P3.y;
  const b = .38 + .62 * easeOut(k), s = 18 + 12 * b;
  ctx.globalAlpha = .14 + .8 * b; ctx.drawImage(FLY, x - s / 2, y - s / 2, s, s);
}
function startCall() {
  const r = $('#plus').getBoundingClientRect();
  call = { t0: clock(), p0: { x: r.left + r.width / 2, y: r.top + r.height / 2 } };
  try { sessionStorage['glade.call'] = JSON.stringify({ t: Date.now() }); } catch {}
  document.body.classList.add('leaving', 'calling');
  cv.animate([{ opacity: 1 }, { opacity: .35 }], { duration: 360, easing: outQuad, fill: 'forwards' });
  $('#list').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: inQuad, fill: 'forwards' });
  $('#q').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, delay: 40, easing: inQuad, fill: 'forwards' });
  $('#plus').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, delay: 320, easing: inQuad, fill: 'forwards' });
  call.timer = setTimeout(go, 480);
}
$('#plus').addEventListener('click', e => {
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // browser default, no motion
  e.preventDefault();
  if (call) { clearTimeout(call.timer); return go(); }                               // a second press skips
  if (reduced) return go();
  startCall();
});
addEventListener('keydown', e => {
  if (call && ['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); clearTimeout(call.timer); go(); }
}, true);
addEventListener('pageshow', e => {
  if (!e.persisted) return;
  document.getAnimations().forEach(a => a.cancel());
  if (call) clearTimeout(call.timer);
  call = null; document.body.classList.remove('leaving', 'calling');
});

/* ---------- Start ---------- */
resize();
load();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
