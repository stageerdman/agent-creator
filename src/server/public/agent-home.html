<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Creator</title>
<style>
  /* The Fireflies look. */
  :root {
    --field: #0B1410; --shadow: #060B08; --fly: #D8F26A;
    --text: #E6EEE8; --quiet: #8C9A90;
    --panel: #101A15; --line: #1E2B24;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    /* One centred column; the plus sits just right of it, so the column keeps room for it on both sides. */
    --col: min(560px, calc(100vw - 136px));
    --top: max(32px, 12vh);
    --field-h: 44px;
  }
  * { box-sizing: border-box; }
  html { background: var(--field); }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 45%, var(--field) 0%, var(--field) 55%, var(--shadow) 100%) fixed;
    color: var(--text); font: 15px/1.5 var(--font); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--fly); outline-offset: 3px; border-radius: 6px; }

  /* The search: centred, soft, iOS-style. Never moves. */
  .find {
    position: fixed; top: var(--top); left: 50%; transform: translateX(-50%); width: var(--col); height: var(--field-h); margin: 0;
  }
  .find svg { position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--quiet); pointer-events: none; }
  .find input {
    width: 100%; height: 100%; padding: 0 14px 0 38px; font: inherit; font-size: 16px; color: var(--text);
    background: rgba(230, 238, 232, .075); border: 0; border-radius: 14px; corner-shape: squircle;
    box-shadow: inset 0 0 0 .5px rgba(230, 238, 232, .08);
    -webkit-backdrop-filter: blur(20px) saturate(1.2); backdrop-filter: blur(20px) saturate(1.2);
    -webkit-appearance: none; appearance: none; caret-color: var(--fly);
    transition: background-color 160ms cubic-bezier(.5, 1, .89, 1), box-shadow 160ms cubic-bezier(.5, 1, .89, 1);
  }
  @supports (corner-shape: squircle) { .find input, .plus { border-radius: 22px; } }
  .find input::placeholder { color: var(--quiet); opacity: 1; }
  .find input:focus { outline: none; background: rgba(230, 238, 232, .11); }
  /* Focused on every load (autofocus), so the ring stays soft: visible, never loud. */
  .find input:focus { box-shadow: inset 0 0 0 1px rgba(216, 242, 106, .38); }
  /* Arrived by keyboard (Tab): a clear ring, like the plus. */
  .kbd .find input:focus-visible { box-shadow: 0 0 0 2px rgba(216, 242, 106, .55); }

  /* The plus: the one way to make an agent, just right of the search. */
  .plus {
    position: fixed; top: var(--top); left: calc(50% + var(--col) / 2 + 12px);
    width: var(--field-h); height: var(--field-h); display: grid; place-items: center;
    border-radius: 14px; corner-shape: squircle; background: rgba(230, 238, 232, .075);
    box-shadow: inset 0 0 0 .5px rgba(230, 238, 232, .08); color: var(--quiet);
    transition: color 120ms cubic-bezier(.5, 1, .89, 1);
  }
  .plus:hover, .plus:focus-visible { color: var(--fly); }
  .plus:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(216, 242, 106, .55); }
  .plus svg { width: 18px; height: 18px; }

  /* The list: every agent, newest first. */
  .list {
    position: fixed; top: calc(var(--top) + var(--field-h) + 16px); bottom: 0; left: 50%; transform: translateX(-50%);
    width: calc(var(--col) + 16px); padding: 0 8px 32px; overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .list ol { list-style: none; margin: 0; padding: 0; }
  .list ol.appear { animation: appear 160ms cubic-bezier(.5, 1, .89, 1) both; }
  @keyframes appear { from { opacity: 0; } }
  .row {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 14px;
    height: 68px; padding: 0 14px 0 6px; border-radius: 14px; color: inherit; text-decoration: none;
  }
  .row:hover { background: rgba(16, 26, 21, .72); }
  .row:focus-visible { outline-offset: 0; border-radius: 14px; }
  .row canvas { width: 56px; height: 56px; display: block; }
  .row .text { min-width: 0; }
  .row .name, .row .desc { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name { font-size: 17px; font-weight: 500; letter-spacing: .01em; line-height: 1.3; }
  .row .desc { font-size: 13px; color: var(--quiet); line-height: 1.4; margin-top: 2px; }
  .row .age { font-size: 13px; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
  li[hidden] { display: none; }

  /* Quiet states: plain text, no magic. */
  .quiet-line { margin: 0; color: var(--quiet); overflow-wrap: anywhere; }
  .quiet-line.nomatch { padding: 22px 14px 0 76px; }
  .quiet-line.empty { padding-top: 18vh; text-align: center; }
</style>
</head>
<body>
<main id="root">
  <form class="find" id="find" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search" aria-label="Search agents" autocomplete="off" spellcheck="false" autofocus>
  </form>
  <nav class="list" id="list" aria-label="Agents">
    <ol id="rows"></ol>
    <p class="quiet-line" id="quiet" role="status" aria-live="polite" hidden></p>
  </nav>
</main>
<a class="plus" id="plus" href="/new" aria-label="New agent" title="New agent">
  <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
</a>

<script type="module">
import { gatherToPlus, isGathering } from './firefly-gather.js';
import { ageLabel, sortAgents, filterAgents, nameOf, descOf } from './agent-list.js';
import { createDna } from './fireflies-dna.js';

const $ = s => document.querySelector(s);
const clock = () => performance.now();
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
const onMq = e => { reduced = e.matches; rows.forEach(r => { r.busy = true; }); };
mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);

// Keyboard users get the clear search ring once they press Tab; a pointer puts it back to soft.
addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); }, true);
addEventListener('pointerdown', () => document.body.classList.remove('kbd'), true);

/* ---------- Where the agents come from: the API, or a mock set (/?demo=0|1|10|50) ---------- */
const demo = new URLSearchParams(location.search).get('demo');
const source = demo != null ? '/mock/home/' + encodeURIComponent(demo) : '/api/agents';
const pageOf = a => '/agents/' + encodeURIComponent(a.id) + (demo != null ? '?demo=' + encodeURIComponent(demo) : '');

/* ---------- Rows: built once, newest first; search only hides and shows ---------- */
let agents = [], rows = [], loaded = false, failed = false;
const fullDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' }); };

function build() {
  const ol = $('#rows'); ol.textContent = '';
  rows = agents.map(a => {
    const li = document.createElement('li'), row = document.createElement('a');
    row.className = 'row'; row.href = pageOf(a);
    const cv = document.createElement('canvas'); cv.setAttribute('aria-hidden', 'true');
    const text = document.createElement('span'); text.className = 'text';
    const n = document.createElement('span'); n.className = 'name'; n.textContent = nameOf(a); n.title = nameOf(a);
    text.appendChild(n);
    if (descOf(a)) { const d = document.createElement('span'); d.className = 'desc'; d.textContent = descOf(a); text.appendChild(d); }
    const age = document.createElement('span'); age.className = 'age'; age.title = fullDate(a.createdAt);
    row.append(cv, text, age); li.appendChild(row); ol.appendChild(li);
    const r = { a, li, cv, age, c: createDna(cv, { name: nameOf(a), files: a.dna || [] }), seen: false, busy: true };
    const notice = () => { r.c.notice(reduced); r.busy = true; };
    row.addEventListener('pointerenter', notice);
    row.addEventListener('focus', notice);
    return r;
  });
  window.dnaLogos = rows.map(r => ({ id: r.a.id, name: nameOf(r.a), logo: r.c }));   // read-only, for checks
  ages();
  rows.forEach(r => seer.observe(r.li));
}
function ages() { const now = Date.now(); rows.forEach(r => { r.age.textContent = ageLabel(r.a.createdAt, now); }); }
setInterval(ages, 30e3);

function render() {
  const q = $('#q').value, shown = new Set(filterAgents(agents, q));
  rows.forEach(r => { r.li.hidden = !shown.has(r.a); });
  const quiet = $('#quiet');
  const empty = loaded && !failed && !agents.length && !q.trim();
  quiet.textContent = !loaded ? '' : failed ? 'Couldn’t load your agents' : empty ? 'Press + to make your first agent' : !shown.size ? `Nothing matches “${q.trim()}”` : '';
  quiet.className = 'quiet-line ' + (empty || failed ? 'empty' : 'nomatch');
  quiet.hidden = !quiet.textContent;
}
$('#q').addEventListener('input', render);
// Type, then Enter: the top visible match opens (like Spotlight).
$('#find').addEventListener('submit', e => {
  e.preventDefault();
  const top = rows.find(r => !r.li.hidden);
  if (top && $('#q').value.trim()) location.href = pageOf(top.a);
});

async function load() {
  try {
    const r = await fetch(source); if (!r.ok) throw new Error(r.status);
    agents = sortAgents(await r.json());
  } catch { failed = true; }
  loaded = true;
  build();
  if (!reduced) $('#rows').classList.add('appear');
  render();
}

// Only rows on screen are drawn, so 50 agents cost what 8 do.
const seer = new IntersectionObserver(es => es.forEach(e => {
  const r = rows.find(x => x.li === e.target); if (r) r.seen = e.isIntersecting;
}), { root: $('#list') });

// Each logo is the Fireflies DNA cluster (fireflies-dna.js). Under Reduce Motion a logo stops drawing once its dots have landed.
let last = clock();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  for (const r of rows) if (r.seen && !r.li.hidden && (!reduced || r.busy)) r.busy = r.c.draw(t, dt, reduced);
  requestAnimationFrame(frame);
}

/* ---------- The plus: fireflies gather into it, then /new (02-merlin-motion.md) ---------- */
const plus = $('#plus');
plus.addEventListener('click', async e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;   // a new tab: no motion
  e.preventDefault();
  if (isGathering()) { location.href = '/new'; return; }                             // a second press skips the wait
  try { await gatherToPlus($('#root'), plus); } finally { location.href = '/new'; }
});
// ⌘N (Ctrl+N elsewhere): New agent, the usual Mac shortcut.
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); plus.click(); }
});

/* ---------- Start ---------- */
load();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
