[package]
name = "agent-creator"
version = "0.1.0"
description = "Agent Creator: native Mac shell around the local Node app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the only way macOS lets a WebKit window be see-through.
tauri = { version = "2", features = ["macos-private-api"] }

# Small binary: the shell does little, so size beats speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
