<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon After Rain · Agent Creator</title>
<style>
  :root {
    --asphalt: #120E12; --haze: #2A2228; --tube: #3A3036; --matte: #1A1418; --ink: #F2E9EC; --quiet: #A8999F; --line: #2F262C; --err: #E89A8F;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --neon: "Avenir Next", "Avenir", "Futura", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--asphalt); color: var(--ink); font: 15px/1.5 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas#street { position: fixed; inset: 0; display: block; z-index: 0; }
  canvas#fx { position: fixed; inset: 0; display: block; z-index: 15; pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Rain on the window glass, in front of the street */
  .glass { position: fixed; inset: 48px 0 0 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .glass i { position: absolute; top: -20%; width: 1.5px; border-radius: 1px; background: linear-gradient(to bottom, rgba(242,233,236,0), rgba(242,233,236,.13) 70%, rgba(242,233,236,.28)); animation: slide linear infinite; }
  .glass b { position: absolute; width: 4px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.32), rgba(242,233,236,.04) 70%); }
  @keyframes slide { to { transform: translateY(140vh); } }

  /* Top bar: matte, plain words only */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px;
    background: var(--matte); border-bottom: 1px solid var(--line); transition: opacity .6s ease-in-out; }
  body.birthing .bar { opacity: .18; }
  body.birthing .bar:hover, body.birthing .bar:focus-within { opacity: 1; }
  .back { color: var(--quiet); text-decoration: none; font-size: 13px; justify-self: start; padding: 6px 4px; }
  .back:hover { color: var(--ink); }
  .scenes { display: flex; gap: 2px; background: var(--asphalt); border-radius: 9px; padding: 2px; }
  .scenes button { border: 0; background: transparent; color: var(--quiet); font-size: 13px; padding: 5px 14px; border-radius: 7px; min-height: 30px; }
  .scenes button:hover { color: var(--ink); }
  .scenes button[aria-current="true"] { background: var(--haze); color: var(--ink); }
  .sound { justify-self: end; border: 0; background: transparent; color: var(--quiet); font-size: 13px; padding: 6px 4px; }
  .sound[aria-pressed="true"] { color: var(--ink); }
  body:not([data-scene="birth"]):not([data-scene="talk"]) .sound { visibility: hidden; } /* sound plays only on Birth and Talk */

  .scene { position: fixed; inset: 48px 0 0 0; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .scene[hidden] { display: none !important; }
  .panel { background: var(--matte); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .primary { background: var(--ink); color: var(--matte); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; min-height: 44px; }
  .primary:disabled { opacity: .4; cursor: default; }
  .quiet-btn { background: transparent; border: 1px solid var(--tube); color: var(--ink); border-radius: 8px; padding: 4px 10px; font-size: 13px; min-height: 32px; }
  .quiet-btn:hover { background: var(--haze); }

  /* The sign: name in glass tube, a frame of tubes, one per file */
  .sign { position: relative; display: inline-block; padding: .26em .55em .34em; font: 300 48px/1 var(--neon); letter-spacing: .06em; white-space: nowrap; transition: filter .12s ease-out; }
  .sign .word, .sign .lit { transition: opacity .4s ease-out; }
  .sign .l { color: var(--tube); }
  .sign .l.on { color: var(--core); text-shadow: 0 0 .14em var(--c), 0 0 .32em var(--c); }
  .sign svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sign path { fill: none; stroke: var(--tube); stroke-width: 3; stroke-linecap: round; }
  .sign path.reading { stroke: var(--c); animation: shimmer 1.6s ease-in-out infinite; }
  .sign path.failed { stroke: #2A2228; }
  .sign path.crack { stroke: #9B8890; stroke-width: 1; stroke-linecap: butt; }
  .sign svg.lit { filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 7px var(--c)); }
  .sign svg.lit path { stroke: var(--core); stroke-width: 2.6; }
  .sign.dim .word, .sign.dim .lit { opacity: .6; }
  .sign.blink .word, .sign.blink .lit { opacity: .12; transition: none; }
  .sign.reflect { transform: scaleY(-1); filter: blur(2.4px); opacity: .34; pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, transparent 85%); }
  .sign.pull { filter: blur(5px); opacity: .72; transition: filter 1.5s ease-in-out, opacity 1.5s ease-in-out; }
  .sign.reflect.pull { filter: blur(7px); opacity: .2; }
  @keyframes shimmer { 0%, 100% { opacity: .22; } 50% { opacity: .42; } }

  /* 1 · Home: shop signs in a row across the street */
  #home { flex-direction: row; justify-content: center; align-items: flex-start; gap: clamp(16px, 4vw, 64px); padding-top: 20vh; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .agent { background: none; border: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; border-radius: 14px; }
  .agent .sign { font-size: clamp(28px, 4.4vw, 56px); }
  .agent:hover .sign, .agent:focus-visible .sign { filter: brightness(1.1); }
  .agent .state { font-size: 13px; line-height: 20px; color: var(--quiet); }
  .agent .state.ready { color: var(--ink); }
  .col .sign.reflect { font-size: clamp(28px, 4.4vw, 56px); margin-top: 14px; }

  /* 2 · Birth */
  #birth { padding-top: 14vh; }
  #birth .sign { font-size: clamp(48px, 7vw, 84px); }
  #bSign .sign { opacity: 0; }
  .birth-words { width: min(560px, calc(100% - 32px)); padding: 16px 20px; margin-top: -24px; opacity: 0; filter: blur(8px); transition: opacity .6s ease-in-out, filter .6s ease-in-out;
    box-shadow: 0 -1px 0 rgba(255,181,71,.25) inset, 0 0 40px rgba(255,181,71,.06), 0 20px 60px rgba(0,0,0,.5); }
  .birth-words.on { opacity: 1; filter: none; }
  .birth-words p { margin: 0; }
  .birth-words .mark { display: block; font-size: 13px; color: var(--quiet); margin-bottom: 4px; }
  .birth-go { margin-top: 18px; opacity: 0; transition: opacity .4s; }
  .birth-go.on { opacity: 1; }
  .skip { position: absolute; right: 20px; bottom: 20px; background: var(--matte); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; min-height: 40px; font-size: 13px; }

  /* 3 · Files: the sign up top, a plain list below */
  #files { padding: 22px 16px 16px; gap: 20px; }
  #files .sign { font-size: clamp(36px, 5vw, 58px); }
  .files-panel { width: min(600px, 100%); flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .files-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .count { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sub { font-size: 13px; color: var(--quiet); }
  .rows { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; }
  .rows li { display: grid; grid-template-columns: 26px 1fr auto; gap: 0 10px; padding: 7px 20px; font-size: 13px; }
  .rows .mark { width: 16px; height: 4px; border-radius: 2px; background: var(--tube); align-self: center; }
  .rows li.reading .mark { background: var(--c); animation: shimmer 1.6s ease-in-out infinite; }
  .rows li.learned .mark { background: var(--core); box-shadow: 0 0 4px var(--c), 0 0 9px var(--c); }
  .rows li.failed .mark { background: linear-gradient(115deg, var(--tube) 44%, #9B8890 46%, #9B8890 52%, var(--tube) 54%); }
  .rows .fname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows .fsize { color: var(--quiet); text-align: right; }
  .rows .fstate { color: var(--quiet); grid-column: 2 / -1; display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
  .rows li.reading .fstate { color: var(--ink); }
  .rows li.failed .fstate { color: var(--err); }
  .drop-hint { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--quiet); margin: 0; }
  .dropping { position: fixed; inset: 48px 0 0 0; z-index: 20; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .dropping span { background: var(--matte); color: var(--ink); padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); }
  body.drag .dropping { display: flex; }

  /* 4 · Talk: the sign small at the top, matte panels */
  #talk { padding: 16px 16px 0; gap: 14px; }
  #talk .sign { font-size: 30px; }
  .chat { width: min(640px, 100%); flex: 1 1 auto; min-height: 0; margin-bottom: 12vh; display: flex; flex-direction: column; overflow: hidden; }
  .chat-head { padding: 12px 22px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--quiet); }
  .chat-head h1 { margin: 0; }
  .msgs { list-style: none; margin: 0; padding: 18px 22px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .msgs .me { align-self: flex-end; max-width: 80%; background: var(--haze); padding: 8px 14px; border-radius: 12px; }
  .msgs .them { max-width: 92%; }
  .msgs .who { display: block; font-size: 13px; color: var(--quiet); }
  .msgs .text { margin: 0; }
  .where { margin-top: 10px; padding: 10px 14px; border: 1px solid var(--tube); border-radius: 10px; font-size: 13px; }
  .where .label { color: var(--quiet); display: block; }
  .where blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--tube); }
  .note { margin: 8px 0 0; font-size: 13px; color: var(--quiet); }
  .composer { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; background: var(--asphalt); color: var(--ink); border: 1px solid var(--tube); border-radius: 10px; padding: 11px 12px; font: inherit; min-height: 44px; max-height: 140px; }
  .composer textarea::placeholder { color: var(--quiet); }

  @media (max-width: 760px) {
    #home { flex-wrap: wrap; padding-top: 10vh; }
    .scenes button { padding: 5px 9px; }
    .back { font-size: 0; } .back::before { content: "←"; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glass i, .sign path.reading, .rows li.reading .mark { animation: none; }
    .glass i { transform: translateY(40vh); }
    .sign path.reading, .rows li.reading .mark { opacity: .3; }
    .bar, .birth-words, .birth-go, .sign, .sign .word, .sign .lit, .sign.pull { transition: none; }
    .sign.pull { filter: none; opacity: 1; }
    .sign.reflect.pull { filter: blur(2.4px); opacity: .34; }
  }
</style>
</head>
<body>
<canvas id="street" aria-hidden="true"></canvas>
<div class="glass" id="glass" aria-hidden="true"></div>

<header class="bar">
  <a class="back" href="index.html">← All concepts</a>
  <nav class="scenes" aria-label="Moments">
    <button data-go="home">Home</button>
    <button data-go="birth">Birth</button>
    <button data-go="files">Files</button>
    <button data-go="talk">Talk</button>
  </nav>
  <button class="sound" id="sound" aria-pressed="false">Sound off</button>
</header>

<main>
  <section id="home" class="scene" aria-label="Home"></section>

  <section id="birth" class="scene" aria-label="Birth" hidden>
    <div id="bSign"></div>
    <div id="bRefl"></div>
    <div class="sr" id="bName" aria-live="polite"></div>
    <div class="birth-words panel" id="bWordsBox"><span class="mark" id="bMark"></span><p id="bWords"></p></div>
    <button class="primary birth-go" id="bTalk" hidden>Talk to Maya</button>
    <button class="skip" id="skip">Skip</button>
  </section>

  <section id="files" class="scene" aria-label="Files" hidden>
    <div id="fSign"></div>
    <div class="files-panel panel">
      <div class="files-head">
        <h1 class="sr" id="fName">Marcus</h1>
        <div class="count" id="fCount" aria-live="polite"></div>
        <div class="sub" id="fSub"></div>
      </div>
      <ul class="rows" id="fRows"></ul>
      <p class="drop-hint">Drop files anywhere to add them · they stay on this Mac</p>
    </div>
  </section>

  <section id="talk" class="scene" aria-label="Talk" hidden>
    <div id="tSign"></div>
    <div class="chat panel">
      <div class="chat-head"><h1 class="sr" id="tName"></h1><span id="tState"></span></div>
      <ol class="msgs" id="msgs"></ol>
      <form class="composer" id="composer">
        <label class="sr" for="q">Message</label>
        <textarea id="q" rows="1"></textarea>
        <button class="primary" id="send">Send</button>
      </form>
    </div>
  </section>
</main>
<div class="dropping" aria-hidden="true"><span id="dropText">adds to Marcus</span></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
"use strict";
/* ============================================================
   Shared demo model: agents, files, the study run, talk, sound.
   (Each concept page carries its own copy, so it opens alone.)
   ============================================================ */
const $ = s => document.querySelector(s);
const clock = () => performance.now();
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
const onMq = e => { reduced = e.matches; };
mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }

let SEQ = 0;
function mkFile(name, size, extra) { return Object.assign({ name, size, status: 'learned', t0: 0, dur: 0, pct: 1, seq: SEQ++ }, extra || {}); }
function generic(n) { const a = []; for (let i = 0; i < n; i++) a.push(mkFile('file ' + (i + 1), 1e5)); return a; }

const MARCUS_OLD = ['Letters to a young manager.pdf', 'Talk — Leading through doubt.txt', 'Interview, radio (2018).txt', 'Notebook 1.md', 'Notebook 2.md', 'Notebook 3.md', 'Workshop day 1.txt', 'Workshop day 2.txt', 'Q&A transcripts.txt', 'Essays 2015–2019.pdf', 'Commencement speech.txt', 'Book draft, ch 1–4.docx', 'Book draft, ch 5–9.docx', 'Podcast ep 12.txt', 'Podcast ep 31.txt', 'Margin notes.md', 'Team memos.pdf', 'Reading list.md'];
const MARCUS_NEW = [
  ['Podcast ep 44.txt', 210e3, 3200], ['Book draft, ch 10–14.docx', 1.8e6, 9800], ['Scan of 1998 diary.pdf', 24e6, 4200, 'It’s a scan · add a text version'],
  ['Mentoring calls (March).txt', 640e3, 6100], ['Podcast ep 57.txt', 190e3, 3900], ['Board letters 2020.pdf', 3.1e6, 8600],
  ['Voice memo 14.m4a', 8.2e6, 7000, 'Audio isn’t supported yet'], ['Mentoring calls (April).txt', 590e3, 7400], ['Lecture — On patience.txt', 120e3, 2600],
  ['Notebook 4.md', 80e3, 5200], ['Interview, 2022.txt', 260e3, 10600], ['Letters, part 2.pdf', 2.2e6, 11800]
];
const MAYA_FILES = ['Studio lectures, week 1.txt', 'Studio lectures, week 2.txt', 'Studio lectures, week 3.txt', 'Studio lectures, week 4.txt', 'Studio lectures, week 5.txt', 'Studio lectures, week 6.txt',
  'Notebook, red.md', 'Notebook, grey.md', 'Crits 2018.pdf', 'Crits 2019.pdf', 'Crits 2020.pdf', 'Crits 2021.pdf', 'Type notes.md', 'Grid essay.pdf', 'Talk — On restraint.txt', 'Interview, 2016.txt',
  'Letters to students.pdf', 'Portfolio reviews.txt', 'Margin notes.md', 'Reading list.md', 'Studio rules.txt', 'Open day Q&A.txt', 'Workshop, posters.txt', 'Workshop, books.txt'];
const AGENTS = [
  { id: 'tony', name: 'Tony', files: generic(30) },
  { id: 'marcus', name: 'Marcus', files: MARCUS_OLD.map((n, i) => mkFile(n, 4e4 + (hash(n) % 3000) * 1000)).concat(
      MARCUS_NEW.map(([n, s, d, reason]) => mkFile(n, s, { status: 'waiting', pct: 0, dur: d, fail: !!reason, reason: reason || '' }))) },
  { id: 'ada', name: 'Ada', files: generic(22) },
];
const MAYA = { id: 'maya', name: 'Maya', files: MAYA_FILES.map(n => mkFile(n, 1e5)), born: false };
const byId = id => AGENTS.concat([MAYA]).find(a => a.id === id);
const MARCUS = byId('marcus');
function homeAgents() { return MAYA.born ? AGENTS.concat([MAYA]) : AGENTS; }
function counts(a) {
  const c = { total: a.files.length, learned: 0, reading: 0, failed: 0, waiting: 0 };
  a.files.forEach(f => c[f.status]++); return c;
}
function isStudying(a) { const c = counts(a); return !!(c.reading || c.waiting); }
function stateText(a) { const c = counts(a); return (c.reading || c.waiting) ? `Studying · ${c.learned} of ${c.total}` : 'Ready'; }

/* ---------- The study run: honest, runs whether you watch or not ---------- */
const run = { started: false, celebrated: true };
const BASE_TITLE = document.title;
function startRun() {
  if (run.started) return; run.started = true;
  const t = Date.now();
  const arriving = MARCUS.files.filter(f => f.status === 'waiting');
  arriving.forEach(f => { f.status = 'reading'; f.t0 = t; });
  run.celebrated = false;
  world.filesArrived(arriving, null);
  renderFiles();
}
function addRealFiles(list, x, y) {
  const t = Date.now(), added = [];
  for (const file of list) {
    const tooBig = file.size > 200e6;
    const f = mkFile(file.name, file.size, { status: 'reading', t0: t, pct: 0, dur: 2500 + Math.random() * 4000,
      fail: tooBig || file.size === 0, reason: tooBig ? 'Too large to read (over 200 MB)' : 'This file is empty' });
    MARCUS.files.unshift(f); added.push(f);
  }
  run.started = true; run.celebrated = false;
  world.filesArrived(added, x == null ? null : { x, y });
  renderFiles();
}
function tickRun() {
  const t = Date.now(); let changed = false;
  for (const f of MARCUS.files) {
    if (f.status !== 'reading') continue;
    f.pct = clamp((t - f.t0) / f.dur, 0, 1);
    if (f.pct >= 1) { f.status = f.fail ? 'failed' : 'learned'; changed = true; f.status === 'learned' ? world.fileLearned(f) : world.fileFailed(f); }
  }
  const c = counts(MARCUS);
  document.title = c.reading ? `${c.learned}/${c.total} · ${BASE_TITLE}` : BASE_TITLE;
  if (!c.reading && !run.celebrated) { run.celebrated = true; world.allDone(); }
  if (changed) { renderFiles(); renderHome(); }
}
setInterval(tickRun, 100);

const pctText = f => `Reading · ${Math.floor(f.pct * 100)}%`;
function renderFiles() {
  const c = counts(MARCUS);
  $('#fCount').textContent = `${c.learned} of ${c.total} learned`;
  const bits = [];
  if (c.reading) bits.push(`${c.reading} reading`);
  if (c.waiting) bits.push(`${c.waiting} waiting`);
  if (c.failed) bits.push(`${c.failed} couldn’t read`);
  $('#fSub').textContent = c.reading ? bits.join(' · ') + ' · you can leave, it keeps going'
                                     : (c.waiting ? 'Studying · ' : 'Ready') + (bits.length ? ' · ' + bits.join(' · ') : '');
  const ul = $('#fRows'); ul.textContent = '';
  for (const f of MARCUS.files) {
    const li = document.createElement('li'); li.className = f.status; f.li = li;
    const st = f.status === 'learned' ? 'Learned' : f.status === 'reading' ? pctText(f) : f.status === 'waiting' ? 'Waiting' : f.reason;
    li.innerHTML = `<span class="mark" aria-hidden="true"></span><span class="fname"></span><span class="fsize">${fmtSize(f.size)}</span><span class="fstate"><span></span></span>`;
    li.querySelector('.fname').textContent = f.name; li.querySelector('.fname').title = f.name;
    li.querySelector('.fstate span').textContent = st;
    ul.appendChild(li);
  }
  world.paintSigns();
}

/* ---------- Talk: first words never wait; sources stay plain ---------- */
const BANK = {
  tony: { q: 'A client says we’re too expensive. What do I say?', keys: ['expensive', 'price', 'client', 'sell', 'sale', 'deal', 'objection', 'cost'],
    a: 'Don’t defend the price. Ask what they’re comparing it to. Nine times out of ten “too expensive” means “I don’t see the value yet”, so go back to the outcome they told you they wanted, and price that, not the hours.',
    src: { ref: 'Workshop 3 · transcript, 14:22', quote: 'Price is only an issue when the value isn’t clear yet.' } },
  marcus: { q: 'I made a mistake in front of the whole team. How do I face them tomorrow?', keys: ['mistake', 'team', 'fail', 'wrong', 'face', 'sorry', 'lead'],
    a: 'Say it first, and say it plainly. What you did is done; what you do next is yours. People forget the mistake long before they forget how you carried it.',
    src: { ref: 'Letters to a young manager.pdf · letter 4', quote: 'The error is the event. The account you give of it is the choice.' } },
  ada: { q: 'Should we rewrite the old billing system?', keys: ['rewrite', 'system', 'code', 'legacy', 'billing', 'refactor', 'bug'],
    a: 'Not yet. Write down the three things that hurt most and fix them in place. If you still want a rewrite after that, at least you’ll know what the new one has to do better.',
    src: { ref: 'Engineering notes 2021 · p. 12', quote: 'Rewrites fail when nobody can say what the old system does.' } },
  maya: { q: 'How do I know when a layout is finished?', keys: ['layout', 'design', 'finished', 'done', 'type', 'grid', 'page'],
    a: 'When you can’t take anything away without it falling apart. Take one thing out. If nobody misses it, it was never needed.',

    fctx.globalCompositeOperation = 'lighter';
    const a = k < 1 ? 1 : 1 - (k - 1) / .6, r = k < 1 ? 9 : 9 + (k - 1) * 30;
    fctx.globalAlpha = a; fctx.drawImage(SPR[s.c], head[0] - r, head[1] - r, r * 2, r * 2);
    if (k < 1) { fctx.fillStyle = '#fff'; fctx.beginPath(); fctx.arc(head[0], head[1], 1.6, 0, 6.2832); fctx.fill(); }
    fctx.globalAlpha = 1; fctx.globalCompositeOperation = 'source-over';
  }
}

/* ---------- 3 · Files and 4 · Talk signs ---------- */
const filesSign = new Sign(MARCUS, false); $('#fSign').appendChild(filesSign.el);
$('.files-panel').style.setProperty('--c', colorOf(MARCUS)[0]); $('.files-panel').style.setProperty('--core', colorOf(MARCUS)[1]);
let talkSign = null;

/* ---------- 2 · Birth: the strike ---------- */
const birth = { active: false, t0: 0, ev: [], i: 0, sign: null, locked: false, lockT: 0, bed: null, timers: [] };
function strikePlan(n, r) {
  const ev = [], stub = Math.min(n - 1, Math.floor(n / 2));
  for (let i = 0; i < n; i++) {
    if (i === stub) { [[2350, 2420], [2700, 2760], [3250, 3600], [3980, 4320]].forEach(([a, b]) => ev.push({ t: a, i, on: 1 }, { t: b, i, on: 0 })); continue; }   // the stubborn one: catches, dies, catches, dies
    const catches = r() < .55, limit = catches ? 2700 + r() * 1800 : 4850; let t = 2000 + r() * 450;
    while (t + 160 < limit) { const d = 40 + r() * 80; ev.push({ t, i, on: 1 }, { t: t + d, i, on: 0 }); t += d + 120 + r() * 520; }
    if (catches) ev.push({ t: limit, i, on: 1 });
  }
  return ev.map(e => ({ t: e.t, fn: () => { birth.sign.setLetter(e.i, !!e.on); if (e.on) playCrackle(); } }));
}
function startBirth() {
  const b = birth; b.active = true; b.locked = false; b.i = 0; b.t0 = clock();
  document.body.classList.add('birthing');
  b.sign = new Sign(MAYA, true); b.sign.mode = 'off'; b.sign.allLetters(false);
  $('#bSign').textContent = ''; $('#bRefl').textContent = ''; $('#bSign').appendChild(b.sign.el); $('#bRefl').appendChild(b.sign.refl);
  b.sign.layout();
  $('#bName').textContent = ''; $('#bWordsBox').classList.remove('on'); $('#bWords').textContent = ''; $('#bMark').textContent = '';
  $('#bTalk').hidden = true; $('#bTalk').classList.remove('on'); $('#skip').hidden = false;
  if (reduced) {                                   // a 300 ms fade to lit, the words at once
    b.sign.els().forEach(e => e.animate([{ opacity: 0 }, { opacity: e === b.sign.refl ? .34 : 1 }], { duration: 300, fill: 'forwards' }));
    lockOn(true); showWords(); return;
  }
  paceTarget = 0;                                  // 0–0.8 s: the street goes quiet, step-printed
  b.bed = rainStart(1800, .26); if (b.bed) b.bed.to(500, .07, .8);
  b.ev = [
    { t: 800, fn: () => b.sign.els().forEach(e => e.animate([{ opacity: 0 }, { opacity: e === b.sign.refl ? .34 : 1 }], { duration: 300, fill: 'forwards' })) },
    { t: 1000, fn: playTick }, { t: 1550, fn: playTick },
    ...strikePlan(MAYA.name.length, rng(hash(MAYA.name))),
    { t: 5000, fn: () => lockOn(false) },
    { t: 5500, fn: () => b.sign.cls('pull', true) },
    { t: 6000, fn: showWords },
    { t: 6800, fn: () => { paceTarget = 1; } },
  ].sort((p, q) => p.t - q.t);
}
function lockOn(still) {
  const b = birth; b.locked = true; b.lockT = clock();
  b.sign.allLetters(true); b.sign.mode = 'on'; b.sign.paint();
  MAYA.born = true; $('#skip').hidden = true; $('#bName').textContent = MAYA.name;
  if (still) return;
  playHum(); if (b.bed) b.bed.to(1400, .14, 1);
  b.sign.refl.animate([{ transform: 'scaleY(-1)' }, { transform: 'scale(1.05,-.9) skewX(4deg)', offset: .25 }, { transform: 'scale(.98,-1.04) skewX(-2deg)', offset: .55 }, { transform: 'scaleY(-1)' }], { duration: 800, easing: 'ease-out' });
}
const FIRST_WORDS = 'You gave me six years of lectures, two notebooks and every crit you ever wrote down. Ask me what you’d have asked me in the studio.';
function showWords() {
  $('#bMark').textContent = 'First words · 25 Nov'; $('#bWords').textContent = FIRST_WORDS; $('#bWordsBox').classList.add('on');
  if (!convo.maya) convo.maya = [{ who: 'them', text: FIRST_WORDS, mark: 'First words · 25 Nov' }];
  $('#bTalk').hidden = false; requestAnimationFrame(() => $('#bTalk').classList.add('on'));
}
function stopBirth() {
  const b = birth; b.active = false; if (b.bed) b.bed.stop(.4); b.bed = null; paceTarget = 1;
  document.body.classList.remove('birthing');
}
function skipBirth() {
  const b = birth; if (!b.active || b.locked || clock() - b.t0 < 200) return;
  while (b.ev[b.i] && b.ev[b.i].t < 5000) b.i++;
  b.sign.els().forEach(e => { e.getAnimations().forEach(a => a.cancel()); e.style.opacity = e === b.sign.refl ? .34 : 1; });
  b.sign.allLetters(false); b.t0 = clock() - 5000;
}
function tickBirth() {
  const b = birth; if (!b.active || reduced) return;
  const tt = clock() - b.t0; while (b.ev[b.i] && b.ev[b.i].t <= tt) b.ev[b.i++].fn();
}
$('#skip').addEventListener('click', e => { e.stopPropagation(); skipBirth(); });
$('#birth').addEventListener('click', e => { if (e.target.closest('button')) return; skipBirth(); });
addEventListener('keydown', e => { if (scene === 'birth' && !['Tab', 'Shift', 'Meta', 'Alt', 'Control'].includes(e.key) && !e.target.closest('.bar')) skipBirth(); });
$('#bTalk').addEventListener('click', () => openTalk(MAYA));

/* ---------- layout per scene: where the ground is, where the signs spill light ---------- */
function shareOf(a) { const c = counts(a); return c.total ? c.learned / c.total : 0; }
function layoutScene() {
  spots = [];
  if (scene === 'home') {
    homeSigns.forEach(s => s.layout());
    const btns = Array.from(document.querySelectorAll('.agent'));
    groundY = btns.length ? Math.max(...btns.map(b => b.getBoundingClientRect().bottom)) + 8 : H * .6;
    spots = homeAgents().map(a => { const r = homeSigns.get(a.id).el.getBoundingClientRect(); return { x: r.left + r.width / 2, w: r.width, c: colorOf(a)[0], spill: () => .4 + .6 * shareOf(a) }; });
  } else if (scene === 'birth' && birth.sign) {
    birth.sign.layout();
    const r = birth.sign.el.getBoundingClientRect(); groundY = r.bottom + 6;
    spots = [{ x: r.left + r.width / 2, w: r.width, c: colorOf(MAYA)[0], spill: () => birth.locked ? clamp((clock() - birth.lockT) / 600, 0, 1) : .25 * birth.sign.litLetters() / MAYA.name.length }];
  } else if (scene === 'files') { filesSign.layout(); groundY = H * .9; }
  else if (scene === 'talk') { if (talkSign) talkSign.layout(); groundY = H - (H - TOP) * .12 + 14; }
  needFull = true;
}

/* ---------- the world hooks the shared model calls ---------- */
let bedSound = null;
function talkBed() {
  const want = sound.on && scene === 'talk';
  if (want && !bedSound) bedSound = rainStart(1100, .2);
  if (!want && bedSound) { bedSound.stop(.6); bedSound = null; }
}
const world = {
  enter(name) { if (name !== 'birth') paceTarget = 1; layoutScene(); requestAnimationFrame(layoutScene); talkBed(); },
  filesArrived() { },
  fileLearned(f) { if (scene === 'files') spark(f); },
  fileFailed() { },
  allDone() { if (scene === 'files') setTimeout(() => filesSign.flutterAll(), 560); },
  notice() { },
  firstWords(a, unknown) { if (talkSign) talkSign.cls('dim', unknown); if (!unknown && !reduced) paceTarget = 0; },
  answerEnd() { paceTarget = 1; },
  placeHomeButtons() { layoutScene(); },
  soundChanged() { talkBed(); },
  paintSigns() { filesSign.paint(); if (talkSign && talkSign.a === MARCUS) { talkSign.paint(); if (scene === 'talk') $('#tState').textContent = stateText(MARCUS); } },
  talkSign(a) { talkSign = new Sign(a, false); $('#tSign').textContent = ''; $('#tSign').appendChild(talkSign.el); talkSign.layout(); },
};

/* rain on the glass: slow streaks and still beads */
(function () {
  const g = $('#glass'), r = rng(23); let html = '';
  for (let i = 0; i < 22; i++) html += `<i style="left:${(r() * 100).toFixed(2)}%;height:${40 + r() * 100 | 0}px;animation-duration:${(7 + r() * 9).toFixed(1)}s;animation-delay:-${(r() * 16).toFixed(1)}s;opacity:${(.4 + r() * .6).toFixed(2)}"></i>`;
  for (let i = 0; i < 40; i++) { const s = 2 + r() * 4; html += `<b style="left:${(r() * 100).toFixed(2)}%;top:${(r() * 100).toFixed(2)}%;width:${s.toFixed(1)}px;height:${(s * 1.2).toFixed(1)}px"></b>`; }
  g.innerHTML = html;
})();

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  [cv, fx].forEach(c => { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); c.style.width = W + 'px'; c.style.height = H + 'px'; });
  layoutScene();
}
addEventListener('resize', resize);

let last = clock(), lastPct = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (reduced) { pace = paceTarget = 1; }
  else if (pace !== paceTarget) pace = paceTarget > pace ? Math.min(paceTarget, pace + dt / .4) : Math.max(paceTarget, pace - dt / .3);
  const stepMs = 125 * (1 - pace);
  if (needFull || (!reduced && t - lastStep >= stepMs)) {
    const sdt = reduced ? 0 : Math.min(.2, (t - lastStep) / 1000) * lerp(.4, 1, pace);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over';
    drawStreet(t, needFull ? 0 : sdt, needFull ? 1 : lerp(.3, 1, pace));
    lastStep = t; needFull = false;
  }
  drawSparks(t);
  tickBirth();
  if (scene === 'birth' && birth.active) needFull = needFull || reduced;   // spill follows the strike
  if (scene === 'home' && !reduced) for (const a of homeAgents()) { const s = homeSigns.get(a.id); if (s && t > s.nextFlutter) { if (!isStudying(a)) s.flutter(); s.nextFlutter = t + 15000 + Math.random() * 10000; } }
  if (scene === 'files' && t - lastPct > 150) {
    lastPct = t;
    for (const f of MARCUS.files) if (f.status === 'reading' && f.li) { const s = f.li.querySelector('.fstate span'); const v = pctText(f); if (s.textContent !== v) s.textContent = v; }
  }
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
resize();
go(SCENES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home');
requestAnimationFrame(t => { last = t; lastStep = t; frame(t); });
</script>
</body>
