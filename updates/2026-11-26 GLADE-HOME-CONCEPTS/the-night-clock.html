<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Clock · Glade Home</title>
<style>
  /* ---------- Shared Glade Home look (same block on all three pages) ---------- */
  :root {
    --field: #0B1410; --shadow: #060B08; --fly: #D8F26A;
    --text: #E6EEE8; --quiet: #8C9A90; --panel: #101A15; --line: #1E2B24; --line-on: #3A4A40;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 45%, var(--field) 0%, var(--field) 55%, var(--shadow) 100%) fixed;
    color: var(--text); font: 15px/1.5 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  canvas#field { position: fixed; inset: 0; display: block; transition: opacity .16s; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fly); outline-offset: 3px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h2 { font-size: 13px; font-weight: 500; color: var(--quiet); margin: 0; }

  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 10;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .back { color: var(--quiet); text-decoration: none; font-size: 13px; justify-self: start; padding: 6px 4px; }
  .back:hover { color: var(--text); }
  .sets { display: flex; gap: 2px; background: var(--shadow); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .sets button { border: 0; background: transparent; color: var(--quiet); font-size: 13px; padding: 5px 14px; border-radius: 7px; min-height: 30px; }
  .sets button:hover { color: var(--text); }
  .sets button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .rm { justify-self: end; border: 0; background: transparent; color: var(--quiet); font-size: 13px; padding: 6px 4px; }
  .rm[aria-pressed="true"] { color: var(--text); }
  .rm[aria-pressed="true"]::before { content: "✓ "; }

  .view { position: fixed; inset: 48px 0 0 0; transition: opacity .16s; }
  .view[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .link { background: none; border: 0; padding: 4px 0; color: var(--quiet); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-on); min-height: 32px; }
  .link:hover { color: var(--text); }
  .field-input { width: 100%; background: var(--shadow); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
  .field-input::placeholder { color: var(--quiet); }
  .field-input:focus { outline: none; border-color: var(--line-on); }
  .field-input:focus-visible { outline: 2px solid var(--fly); outline-offset: 2px; }

  /* An agent: a fixed hit box = cluster area + its name panel. */
  .agent {
    position: absolute; border: 0; background: transparent; padding: 0; border-radius: 14px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  }
  .tag { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px 10px 4px; text-align: center; white-space: nowrap; transition: border-color .16s; }
  .tag .name { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; transition: color .16s; }
  .tag .state { display: block; font-size: 13px; color: var(--quiet); line-height: 1.3; }
  .agent:hover .tag, .agent:focus-visible .tag, .agent.sel .tag { border-color: var(--line-on); }
  .agent.dim .name { color: var(--quiet); }
  .sketches { position: absolute; display: flex; align-items: center; gap: 22px; }
  .sketches[hidden] { display: none; }
  .hint { min-height: 22px; font-size: 13px; color: var(--quiet); margin: 0; }
  .hint b { color: var(--text); font-weight: 500; }
  .sketch { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; font-size: 13px; margin-left: 18px; min-height: 32px; }
  .sketch:hover, .sketch:focus-visible { border-color: var(--line-on); }

  /* Stand-ins: where each job ends. */
  .stand { display: flex; align-items: center; justify-content: center; }
  .stand-panel { width: min(560px, calc(100% - 32px)); padding: 22px 24px 18px; }
  .stand-panel h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  .stand-panel .note { margin: 10px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .stand-panel .sub { color: var(--quiet); font-size: 13px; margin: 0; }
  .stand-panel ol, .stand-panel ul { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .stand-panel .me { align-self: flex-end; max-width: 80%; background: var(--shadow); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; }
  .stand-panel .who { display: block; font-size: 13px; color: var(--quiet); }
  .stand-panel blockquote { margin: 12px 0 0; padding-left: 12px; border-left: 2px solid var(--line-on); }
  .stand-panel ul li { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .stand-panel .home-link { margin-top: 16px; }

  .dropping { position: fixed; inset: 48px 0 0 0; z-index: 20; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .dropping div { padding: 16px 22px; text-align: center; }
  .dropping p { margin: 0; } .dropping p + p { color: var(--quiet); font-size: 13px; }
  body.drag .dropping { display: flex; }
  body.drag #field, body.drag #home { opacity: .4; }

  /* ---------- The Night Clock ---------- */
  .chip { position: absolute; margin: 0; padding: 4px 12px; font-size: 13px; line-height: 1.4; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; white-space: nowrap; z-index: 2; }
  .chip[hidden] { display: none; }
  .chip.now { color: var(--quiet); }
  .agent.ring:focus { outline: 2px solid var(--fly); outline-offset: 3px; }
  .tk { position: absolute; padding: 4px 10px 5px; border-radius: 9px; font-size: 13px; line-height: 1.3; white-space: nowrap; transition: border-color .16s; }
  .tk .tm { color: var(--quiet); }
  /* The title always shows. When room is tight it ends in an ellipsis; the time is never cut. */
  .tk .tt { display: inline-block; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; }
  .tk .sep { white-space: pre; }
  .tk:hover, .tk:focus-visible, .tk.hot { border-color: var(--line-on); }
  .tkdot { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 0; padding: 0; background: transparent; border-radius: 50%; }
  .hollow { position: absolute; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .hollow label { font-size: 13px; font-weight: 500; color: var(--quiet); }
  .hollow .link { align-self: flex-start; }
  @media (max-width: 760px) {
    .sets button { padding: 5px 9px; }
    .back { font-size: 0; } .back::before { content: "←"; font-size: 15px; }
  }</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header class="bar">
  <a class="back" href="index.html">← All concepts</a>
  <nav class="sets" aria-label="Demo data">
    <button data-set="0">First run</button>
    <button data-set="4">4 agents</button>
    <button data-set="12">12 agents</button>
  </nav>
  <button class="rm" id="rm" aria-pressed="false">Reduced motion</button>
</header>

<main>
  <section id="home" class="view" aria-label="Home">
    <p class="chip now" id="moon"></p>
    <p class="chip" id="chip" aria-live="polite" hidden></p>
    <div id="agents"></div>
    <div id="track" aria-label="Recent talks"></div>
    <div class="hollow panel" id="hollow">
      <label for="mk">New agent</label>
      <input class="field-input" id="mk" placeholder="Describe someone…" autocomplete="off" spellcheck="false" aria-describedby="mkHint">
      <p class="hint" id="mkHint" aria-live="polite"></p>
      <button class="link" id="folderBtn">or bring a folder</button>
    </div>
    <div class="sketches" id="sketches" hidden><h2>Sketches</h2></div>
  </section>
  <section id="talk" class="view stand" aria-label="Talk" hidden>
    <div class="panel stand-panel">
      <h1 id="tHead"></h1>
      <p class="sub" id="tSub"></p>
      <p class="note" id="tNote" hidden></p>
      <ol id="tLines"></ol>
      <button class="link home-link" data-home>Back to Home</button>
    </div>
  </section>

  <section id="make" class="view stand" aria-label="New agent" hidden>
    <div class="panel stand-panel">
      <h1>New agent</h1>
      <p class="sub" id="mSub"></p>
      <blockquote id="mLine" hidden></blockquote>
      <ul id="mFiles" hidden></ul>
      <button class="link home-link" data-home>Back to Home</button>
    </div>
  </section>
</main>
<div class="dropping" aria-hidden="true"><div class="panel"><p>Drop · your files stay on this Mac</p><p>Claude reads them to study</p><p>for a new agent</p></div></div>
<input type="file" id="folder" webkitdirectory multiple hidden>

<script>
"use strict";
/* ============================================================
   Shared Glade Home core (the same on all three pages, so each opens alone)
   ============================================================ */
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const TAU = Math.PI * 2;
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const easeOut = x => 1 - (1 - x) * (1 - x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* Sample data: identical on all three pages. "Now" in the demo is 10:40. */
const NOW_H = 10 + 40 / 60;
const AGENTS = [
  { name: 'Rex',    about: 'blunt newsletter editor', state: 'ready', files: 24, hour: 10 },
  { name: 'Ines',   about: 'her design course',       state: 'studying', learned: 18, total: 30, hour: 19 },
  { name: 'Maya',   about: 'career mentor',           state: 'ready', files: 31, hour: 21 },
  { name: 'Tony',   about: 'pricing and sales',       state: 'ready', files: 17, hour: 14 },
  { name: 'Marcus', about: 'running coach',           state: 'ready', files: 12, hour: 7 },
  { name: 'Amara',  about: 'contract lawyer',         state: 'studying', learned: 4, total: 22, hour: 11 },
  { name: 'Jun',    about: 'imported from Lena',      state: 'new', files: 19, hour: 16 },
  { name: 'Priya',  about: 'product strategist',      state: 'ready', files: 28, hour: 13 },
  { name: 'Theo',   about: 'poetry teacher',          state: 'ready', files: 14, hour: 22 },
  { name: 'Lena',   about: 'research supervisor',     state: 'ready', files: 40, hour: 9 },
  { name: 'Sol',    about: 'sleep and calm',          state: 'ready', files: 9,  hour: 23 },
  { name: 'Hugo',   about: 'cookbook author',         state: 'ready', files: 21, hour: 18 },
];
const SKETCHES = ['Untitled sketch', 'Pitch coach'];
const TALKS = [
  { agent: 'Rex',  title: 'Subject lines for Friday', when: 'today 09:50',
    lines: [['me', 'Too clickbait?'], ['Rex', 'Yes. Drop the question mark and say what’s inside.']] },
  { agent: 'Maya', title: 'The job offer', when: 'yesterday 21:30',
    lines: [['me', 'They came back with 10% more. Do I take it?'], ['Maya', 'Ask for the start date you want first. Money is easier to move than time.']] },
  { agent: 'Ines', title: 'Week 3 critique', when: 'yesterday 19:10',
    lines: [['me', 'Is the grid too tight?'], ['Ines', 'The gutters are fine. The type is too big for them.']] },
  { agent: 'Tony', title: 'Pricing the workshop', when: 'yesterday 14:05',
    lines: [['me', 'Should I offer an early-bird price?'], ['Tony', 'Only with a real deadline. Otherwise it’s just a discount.']] },
  { agent: 'Lena', title: 'Chapter 2 structure', when: 'Mon 09:20',
    lines: [['me', 'Should the methods come first?'], ['Lena', 'Lead with the question. The methods can wait a page.']] },
];
let SET = 12;
function data() {
  if (SET === 0) return { agents: [], sketches: [], talks: [] };
  if (SET === 4) return { agents: AGENTS.slice(0, 4), sketches: SKETCHES.slice(0, 1), talks: TALKS.slice(0, 4) };
  return { agents: AGENTS, sketches: SKETCHES, talks: TALKS };
}
function stateText(a) { return a.state === 'studying' ? `Studying · ${a.learned} of ${a.total}` : a.state === 'new' ? 'new here' : 'Ready'; }
const byName = n => AGENTS.find(a => a.name === n);

/* Reduced motion: the system setting, or the demo switch. */
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let rmSwitch = false;
let reduced = mq.matches;
function setReduced() { reduced = mq.matches || rmSwitch; $('#rm').setAttribute('aria-pressed', reduced); if (window.Concept) Concept.motionChanged && Concept.motionChanged(); }
mq.addEventListener ? mq.addEventListener('change', setReduced) : mq.addListener(setReduced);
$('#rm').addEventListener('click', () => { rmSwitch = !rmSwitch; setReduced(); });

/* Light */
const cv = $('#field'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function sprite(rgb, core) {
  const s = document.createElement('canvas'); s.width = s.height = 64; const g = s.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, core); gr.addColorStop(.12, `rgba(${rgb},.85)`); gr.addColorStop(.32, `rgba(${rgb},.25)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const FLY = sprite('216,242,106', 'rgba(246,255,214,1)');
const PALE = sprite('230,238,232', 'rgba(255,255,255,1)');
/* The Glade flash: rise 120 ms ease-out, fall 900 ms ease-in. The answer is shorter: 80 / 600. */
function flash(dt) { if (dt < 0 || dt > 1020) return 0; if (dt < 120) return easeOut(dt / 120); const x = (dt - 120) / 900; return 1 - x * x; }
function flashA(dt) { if (dt < 0 || dt > 680) return 0; if (dt < 80) return easeOut(dt / 80); const x = (dt - 80) / 600; return 1 - x * x; }

/* No light within 8 px of any panel (words always sit on solid panels, never on light). */
let blockers = [];
function readBlockers() {
  blockers = [];
  for (const el of document.querySelectorAll('.bar, .panel, .tag, .sketch, .chip')) {
    const r = el.getBoundingClientRect(); if (r.width && r.height) blockers.push([r.left - 8, r.top - 8, r.right + 8, r.bottom + 8]);
  }
}
function clear(x, y) { for (const b of blockers) if (x > b[0] && x < b[2] && y > b[1] && y < b[3]) return false; return true; }
function dot(x, y, s, a, img) { if (a <= .004 || !clear(x, y)) return; ctx.globalAlpha = Math.min(.9, a); ctx.drawImage(img || FLY, x - s / 2, y - s / 2, s, s); }

/* A cluster: one point per file (at least 12, at most 40). */
function lights(a) { return clamp(a.state === 'studying' ? a.total : a.files, 12, 40); }
function makeCluster(a) {
  const r = rng(hash(a.name)), n = lights(a), R = 9 + 3.6 * Math.sqrt(n), seed = r() * 6.28, pts = [];
  for (let i = 0; i < n; i++) {
    const rr = R * Math.sqrt((i + .5) / n), th = i * 2.39996 + seed;
    pts.push({ sx: Math.cos(th) * rr, sy: Math.sin(th) * rr * .86, a: r() * TAU, b: r() * TAU, j: r() * 25, glow: .2 + r() * .4, flashT: -1e9 });
  }
  return { a, R, pts, cx: 0, cy: 0, scale: 1, period: 2.4 + (hash(a.name + 't') % 1000) / 1000, lastBeat: -1e9 + r() * 3000,
    flashT: -1e9, shape: 'beat', lastFlash: -1e9, next: 0, dim: 0, dimTo: 0, lit: false, hold: false, r };
}
/* At most one flash per 2 s from any one cluster. */
function fire(c, t, shape) { if (t - c.lastFlash < 2000) return false; c.flashT = t; c.shape = shape || 'beat'; c.lastFlash = t; return true; }
function ownBeat(c, t) { if (c.a.state === 'studying') return; if (t - c.lastBeat >= c.period * 1000) { c.lastBeat = t; fire(c, t); } }
/* Studying: points blink on their own, scattered; one burst of a few points at most every 2 s. */
function scatter(c, t) {
  if (c.a.state !== 'studying' || reduced || t < c.next || t - c.lastFlash < 2000) return;
  const k = 3 + Math.floor(c.r() * 3);
  for (let i = 0; i < k; i++) c.pts[Math.floor(c.r() * c.pts.length)].flashT = t + c.r() * 500;
  c.lastFlash = t; c.next = t + 2000 + c.r() * 1600;
}
function drawCluster(c, t, dt) {
  const ready = c.a.state !== 'studying';
  if (reduced) c.dim = c.dimTo; else c.dim += clamp(c.dimTo - c.dim, -dt / .16, dt / .16);
  const k = 1 - .8 * c.dim, cb = c.shape === 'answer' ? flashA : flash;
  for (const p of c.pts) {
    let x = c.cx + p.sx * c.scale, y = c.cy + p.sy * c.scale;
    if (!reduced && !c.hold) { x += Math.sin(t / 8000 * TAU + p.a) * 1.5; y += Math.cos(t / 8000 * TAU + p.b) * 1.5; }
    let alpha, size;
    if (reduced) { alpha = c.lit ? .9 : ready ? .8 : p.glow; size = 13; }
    else { const b = Math.max(cb(t - c.flashT - p.j), ready ? 0 : flash(t - p.flashT)); alpha = .1 + .8 * b; size = 12 + 9 * b; }
    dot(x, y, size * c.scale, alpha * k);
  }
}
/* Glowworms: sketches. Steady, faint, low; they never blink. */
function glowworm(x, y) { dot(x, y, 10, .35); }
/* Wild fireflies (first run only): tiny, 0.15, no names, not clickable. */
let wild = [];
function makeWild(spots) { const r = rng(7); wild = spots.map(([x, y]) => ({ x, y, next: r() * 4000, t: -1e9, r })); }
function drawWild(t) {
  for (const w of wild) {
    if (reduced) { dot(w.x, w.y, 8, .1); continue; }
    if (t > w.next) { w.t = t; w.next = t + 3000 + w.r() * 4000; }
    dot(w.x, w.y, 9, .15 * flash(t - w.t) + .02);
  }
}

/* Hit boxes: the cluster area plus its name panel; set once per layout, never moved before the click. */
function agentButton(a, onOpen) {
  const b = document.createElement('button'); b.className = 'agent'; b.dataset.name = a.name;
  b.innerHTML = '<span class="tag"><span class="name"></span><span class="state"></span></span>';
  b.querySelector('.name').textContent = a.name; b.querySelector('.state').textContent = stateText(a);
  b.setAttribute('aria-label', `${a.name}, ${stateText(a)}. Talk.`);
  b.addEventListener('click', () => onOpen(a));
  return b;
}
function placeAgent(b, c, w) {
  const top = c.cy - c.R * c.scale - 10, tagTop = c.cy + c.R * c.scale + 14;
  w = w || 140;
  b.style.left = (c.cx - w / 2) + 'px'; b.style.width = w + 'px';
  b.style.top = (top - 48) + 'px'; b.style.height = (tagTop - top + 44) + 'px';
}
function holdOn(b, c) {
  const on = () => { c.hold = b.matches(':hover') || document.activeElement === b; };
  ['pointerenter', 'pointerleave', 'focus', 'blur'].forEach(e => b.addEventListener(e, on));
}
function sketchButton(name) {
  const b = document.createElement('button'); b.className = 'sketch'; b.textContent = name;
  b.setAttribute('aria-label', `${name}, sketch. Talk.`);
  b.addEventListener('click', () => openTalk({ name, sketch: true }));
  return b;
}

/* Views: Home, and the two stand-ins every job ends in. */
let view = 'home';
function show(v) {
  view = v; ['home', 'talk', 'make'].forEach(id => { $('#' + id).hidden = id !== v; });
  cv.style.visibility = v === 'home' ? 'visible' : 'hidden';
}
function openTalk(a, talk) {
  $('#tHead').textContent = `Talk · ${a.name} · ${talk ? talk.title : 'new talk'}`;
  $('#tSub').textContent = talk ? `${talk.when} · the last two lines` : 'Talk opens here, as a new talk.';
  const note = $('#tNote');
  note.hidden = a.state !== 'studying';
  if (a.state === 'studying') note.textContent = `${a.name} has studied ${a.learned} of ${a.total} files so far. She answers from those.`;
  const ol = $('#tLines'); ol.textContent = '';
  (talk ? talk.lines : []).forEach(([who, text]) => {
    const li = document.createElement('li');
    if (who === 'me') { li.className = 'me'; li.textContent = text; }
    else { li.innerHTML = '<span class="who"></span><span class="text"></span>'; li.querySelector('.who').textContent = who; li.querySelector('.text').textContent = text; }
    ol.appendChild(li);
  });
  show('talk'); $('#talk [data-home]').focus();
}
function openMake(what) {
  const line = $('#mLine'), ul = $('#mFiles');
  line.hidden = !what.line; ul.hidden = !what.files; ul.textContent = '';
  if (what.line) { line.textContent = '“' + what.line + '”'; $('#mSub').textContent = 'From this line:'; }
  if (what.files) {
    $('#mSub').textContent = `From ${what.files.length} file${what.files.length === 1 ? '' : 's'} · they stay on this Mac`;
    what.files.slice(0, 12).forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
    if (what.files.length > 12) { const li = document.createElement('li'); li.textContent = `and ${what.files.length - 12} more`; ul.appendChild(li); }
  }
  show('make'); $('#make [data-home]').focus();
}
function goHome() { show('home'); Concept.build(); }
$$('[data-home]').forEach(b => b.addEventListener('click', goHome));

/* Make new: bring a folder (a real picker), drop anywhere, ⌘⇧N. */
$('#folder').addEventListener('change', e => { const f = Array.from(e.target.files || []); e.target.value = ''; if (f.length) openMake({ files: f.map(x => x.webkitRelativePath || x.name) }); });
function pickFolder() { $('#folder').click(); }
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e) || view !== 'home') return; e.preventDefault(); dragDepth++; document.body.classList.add('drag'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('drag');
  const list = e.dataTransfer && e.dataTransfer.files; if (!list || !list.length || view !== 'home') return;
  openMake({ files: Array.from(list).map(f => f.name) });
});
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault(); if (view !== 'home') goHome(); Concept.focusNew();
  }
}, true);

/* Demo switch */
function markSet() { $$('.sets button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.set === SET)); }
$$('.sets button').forEach(b => b.addEventListener('click', () => { SET = +b.dataset.set; markSet(); show('home'); Concept.build(); }));

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  Concept.layout(); // resize only runs after start(), so Concept exists (a top-level const is not on window)
}
addEventListener('resize', resize);
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (view === 'home') { readBlockers(); ctx.globalCompositeOperation = 'lighter'; Concept.draw(t, dt); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  requestAnimationFrame(frame);
}
function start() { markSet(); setReduced(); resize(); Concept.build(); requestAnimationFrame(t => { last = t; frame(t); }); }

/* ============================================================
   3 · The Night Clock
   A round glade that keeps time. Each agent stands at their hour;
   the moon sits on now, so the likely one is already focused under it.
   ============================================================ */
const CK = { d: null, nowH: NOW_H, clusters: [], btns: [], talks: [], first: null, q: '', hits: [], r: 0, cx: 0, cy: 0, moon: { x: 0, y: 0 }, worms: [] };
const mk = $('#mk'), mkHint = $('#mkHint'), chip = $('#chip'), moonEl = $('#moon');
const deg = x => ((x % 360) + 360) % 360, deg180 = x => deg(x + 180) - 180;
const fmt = h => { h = ((h % 24) + 24) % 24; const m = Math.round(h * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const easeIn = x => x * x;
/* An agent's hour sits at (hour − now) × 15° clockwise from 12 (centre of the hour). */
const rawAng = a => deg180((a.hour + .5 - CK.nowH) * 15);
function talkHour(k) { const [day, hm] = k.when.split(' '), [h, m] = hm.split(':').map(Number); return { day, h: h + m / 60 }; }

/* Two agents can't share a spot: spread neighbours to a minimum gap, keeping the one under the moon where it is. */
function spread(raws, g, keep) {
  const n = raws.length; if (n < 2) return raws.slice();
  const idx = raws.map((_, i) => i).sort((i, j) => deg(raws[i]) - deg(raws[j]));
  const a = idx.map(i => deg(raws[i]));
  for (let it = 0; it < 400; it++) {
    let moved = false;
    for (let s = 0; s < n; s++) {
      const t = (s + 1) % n, gap = n === 2 && t === 0 ? 360 - (a[1] - a[0]) : (t === 0 ? a[0] + 360 - a[s] : a[t] - a[s]);
      if (gap < g - .01) { const p = (g - gap) / 2; a[s] -= p; a[t] += p; moved = true; }
    }
    if (!moved) break;
  }
  const out = []; idx.forEach((i, k) => { out[i] = a[k]; });
  const shift = raws[keep] - out[keep];
  return out.map(x => deg180(x + shift));
}

const Concept = {
  build() {
    const d = CK.d = data(), empty = !d.agents.length;
    document.body.classList.toggle('empty', empty);
    // The one under the moon goes first; the rest follow clockwise (later in the day).
    const raws = d.agents.map(rawAng);
    let near = 0; raws.forEach((x, i) => { if (Math.abs(x) < Math.abs(raws[near])) near = i; });
    const order = d.agents.map((a, i) => i).sort((i, j) => deg(raws[i] - raws[near]) - deg(raws[j] - raws[near]));
    const box = $('#agents'); box.textContent = ''; CK.clusters = []; CK.btns = [];
    order.forEach(i => {
      const a = d.agents[i], c = makeCluster(a), b = agentButton(a, x => openTalk(x));
      if (a.state === 'studying') { const n = Math.min(30, a.total); c.ring = { n, litT: new Array(n).fill(-1e9), mergeT: 0 }; }
      holdOn(b, c); b.addEventListener('blur', () => b.classList.remove('ring'));
      box.appendChild(b); CK.clusters.push(c); CK.btns.push(b);
    });
    // The inner track: the 4 most recent talks, from any day, at the hour they happened.
    // Not today? The time carries its day word ("Mon 09:20"), so a Monday morning is never empty.
    const tr = $('#track'); tr.textContent = ''; CK.talks = [];
    d.talks.slice(0, 4).forEach(k => {
      const a = byName(k.agent), { day, h } = talkHour(k);
      const b = document.createElement('button'); b.className = 'tk panel'; b.title = k.title;
      const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = k.title;
      const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = ' · ';
      const s = document.createElement('span'); s.className = 'tm'; s.textContent = (day === 'today' ? '' : day + ' ') + fmt(h);
      b.append(tt, sep, s);
      b.setAttribute('aria-label', `${k.title}, with ${k.agent}, ${k.when}. Open talk.`);
      const dotB = document.createElement('button'); dotB.className = 'tkdot'; dotB.tabIndex = -1; dotB.setAttribute('aria-hidden', 'true');
      [b, dotB].forEach(x => x.addEventListener('click', () => openTalk(a, k)));
      ['pointerenter', 'pointerleave'].forEach(e => dotB.addEventListener(e, () => b.classList.toggle('hot', e === 'pointerenter')));
      tr.appendChild(dotB); tr.appendChild(b); CK.talks.push({ k, h, b, dotB, x: 0, y: 0 });
    });
    const sk = $('#sketches'); sk.hidden = !d.sketches.length; sk.querySelectorAll('.sketch').forEach(n => n.remove());
    d.sketches.forEach(n => sk.appendChild(sketchButton(n)));
    mk.value = ''; CK.q = ''; hideChip();
    this.layout(); updateMk();
    // Focus on arrival: the agent nearest the moon (one Return away). First run: the hollow field.
    CK.first = CK.btns[0] || null;
    if (empty) mk.focus(); else { CK.first.classList.add('ring'); CK.first.focus({ preventScroll: true }); }
  },
  layout() {
    if (!CK.d || $('#home').hidden) return;
    const vh = H - 48, empty = !CK.d.agents.length;
    const r = CK.r = Math.max(150, Math.min(.38 * Math.min(W, vh), (vh - 180) / 2));
    const cx = CK.cx = W / 2, cy = CK.cy = 48 + vh / 2 - 11;
    // Agents on the dial.
    const n = CK.clusters.length;
    if (n) {
      const g = Math.min(360 / n * .99, 2 * Math.asin(Math.min(1, 70 / r)) * 180 / Math.PI);
      const angs = spread(CK.clusters.map(c => rawAng(c.a)), g, 0);
      CK.clusters.forEach((c, i) => {
        const th = angs[i] * Math.PI / 180, b = CK.btns[i];
        c.ang = angs[i]; c.cx = cx + Math.sin(th) * r; c.cy = cy - Math.cos(th) * r; c.scale = 1;
        const extra = c.ring ? 12 : 0, tw = b.querySelector('.tag').offsetWidth;
        placeAgent(b, { cx: c.cx, cy: c.cy, R: c.R + extra, scale: 1 }, Math.max(2 * (c.R + extra) + 16, tw + 4));
      });
    }
    // The hollow, in the centre.
    const hp = $('#hollow'), hw = Math.min(300, W - 48);
    hp.style.width = hw + 'px'; hp.style.left = (cx - hw / 2) + 'px';
    hp.style.top = (cy - hp.offsetHeight / 2 - 48) + 'px';
    // The inner track at 62%. Each label takes the first side of its dot (inward first) that is clear
    // of the name tags, the hollow and the labels already placed; on a short window it may sit outward.
    // No side clear at full width? The title shortens with an ellipsis (never to just the time).
    const ri = .62 * r, pad = 4, caps = ['none', 180, 160, 140, 120, 104, 88, 72].map(x => x === 'none' ? x : x + 'px');
    const taken = CK.btns.map(b => b.querySelector('.tag').getBoundingClientRect()).concat([hp.getBoundingClientRect()]);
    const clear = q => taken.every(o => q.right + pad <= o.left || q.left >= o.right + pad || q.bottom + pad <= o.top || q.top >= o.bottom + pad);
    CK.talks.forEach(t => {
      const th = (t.h - CK.nowH) * 15 * Math.PI / 180, s = Math.sin(th), co = Math.cos(th);
      t.x = cx + s * ri; t.y = cy - co * ri;
      t.dotB.style.left = t.x + 'px'; t.dotB.style.top = (t.y - 48) + 'px';
      const sides = () => {
        const w = t.b.offsetWidth, h = t.b.offsetHeight;
        const at = (left, top) => ({ left, top, right: left + w, bottom: top + h });
        const inV = at(t.x - w / 2, co > 0 ? t.y + 16 : t.y - 16 - h), outV = at(t.x - w / 2, co > 0 ? t.y - 16 - h : t.y + 16);
        const inH = at(s > 0 ? t.x - 16 - w : t.x + 16, t.y - h / 2), outH = at(s > 0 ? t.x + 16 : t.x - 16 - w, t.y - h / 2);
        return Math.abs(s) < .5 ? [inV, inH, outH, outV] : [inH, inV, outV, outH];
      };
      const tt = t.b.querySelector('.tt'); let q = null, first = null;
      for (const cap of caps) {
        tt.style.maxWidth = cap; const tries = sides();
        first = first || tries[0]; q = tries.find(clear); if (q) break;
      }
      if (!q) { tt.style.maxWidth = caps[0]; q = first; }
      taken.push(q);
      t.b.style.left = q.left + 'px'; t.b.style.top = (q.top - 48) + 'px';
    });
    // The moon at 12, outside the ring; its panel to the right, the find chip to the left.
    CK.moon = { x: cx, y: cy - r - 58 };
    moonEl.textContent = 'now · ' + fmt(CK.nowH);
    moonEl.style.left = (cx + 18) + 'px'; moonEl.style.top = (CK.moon.y - moonEl.offsetHeight / 2 - 48) + 'px';
    chip.style.right = (W - cx + 18) + 'px'; chip.style.top = moonEl.style.top;
    // Sketches: a strip in the bottom-left corner.
    const sk = $('#sketches'); sk.style.left = '24px'; sk.style.top = (H - 48 - 46) + 'px';
    CK.worms = [];
    requestAnimationFrame(() => { sk.querySelectorAll('.sketch').forEach(b => { const q = b.getBoundingClientRect(); CK.worms.push([q.left - 13, q.top + q.height / 2]); }); });
    if (empty) makeWild([[W * .08, 48 + vh * .16], [W * .9, 48 + vh * .12], [W * .12, H * .84], [W * .92, H * .8], [W * .7, H * .95]]);
    else wild = [];
  },
  draw(t, dt) {
    const empty = !CK.d.agents.length;
    // The dial: a faint hairline, no numbers (hidden on first run: an empty ring is dead UI). The moon: steady, never flashes.
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (!empty) { ctx.strokeStyle = '#1E2B24'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(CK.cx, CK.cy, CK.r, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = 'rgba(230,238,232,.7)'; ctx.beginPath(); ctx.arc(CK.moon.x, CK.moon.y, 7, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    for (const c of CK.clusters) {
      ownBeat(c, t); scatter(c, t); drawCluster(c, t, dt);
      const g = c.ring; if (!g) continue;
      // The progress ring: one point per file (30 at most), learned ones steady at 0.7, the rest dim at 0.15.
      const lit = Math.round(c.a.learned * g.n / c.a.total);
      const k = g.mergeT ? (reduced ? 1 : easeIn(clamp((t - g.mergeT) / 600, 0, 1))) : 0;
      const rad = (c.R + 11) * (1 - .75 * k);
      for (let i = 0; i < g.n; i++) {
        const th = i / g.n * TAU - Math.PI / 2;
        const rise = reduced ? 1 : easeOut(clamp((t - g.litT[i]) / 400, 0, 1));
        const a = (i < lit ? .15 + .55 * rise : .15) * (1 - k);
        dot(c.cx + Math.cos(th) * rad, c.cy + Math.sin(th) * rad * .92, 7, a);
      }
    }
    // The inner track: small steady silver points, brighter while their talk is hovered or focused.
    for (const k of CK.talks) {
      const hot = k.b.matches(':hover') || k.b.classList.contains('hot') || document.activeElement === k.b;
      dot(k.x, k.y, hot ? 13 : 10, hot ? .9 : .6, PALE);
    }
    CK.worms.forEach(([x, y]) => glowworm(x, y));
    drawWild(t);
  },
  focusNew() { mk.focus(); mk.select(); },
  motionChanged() {},
};

function setTag(i) {
  const b = CK.btns[i], a = CK.clusters[i].a;
  b.querySelector('.state').textContent = stateText(a);
  b.setAttribute('aria-label', `${a.name}, ${stateText(a)}. Talk.`);
}

/* The ring closes: in the demo Amara learns one more file every 6 s. When the last one lights,
   the ring slides into the cluster (600 ms), one flash, and she's ready. */
setInterval(() => {
  const i = CK.clusters.findIndex(c => c.a.name === 'Amara' && c.ring && !c.ring.mergeT);
  if (i < 0) return;
  const c = CK.clusters[i], g = c.ring, a = c.a, now = performance.now();
  if (a.learned >= a.total) return;
  const before = Math.round(a.learned * g.n / a.total);
  a.learned++;
  const after = Math.round(a.learned * g.n / a.total);
  for (let j = before; j < after; j++) g.litT[j] = now;
  setTag(i);
  if (a.learned >= a.total) {
    setTimeout(() => {
      g.mergeT = performance.now();
      setTimeout(() => {
        a.state = 'ready'; a.files = a.total; c.ring = null; c.lastFlash = -1e9; fire(c, performance.now());
        setTag(i); if (view === 'home') Concept.layout();
      }, reduced ? 0 : 600);
    }, 400);
  }
}, 6000);

/* The moon's turn: recalculated every minute; nobody sees it move. */
setInterval(() => { CK.nowH += 1 / 60; Concept.layout(); }, 60000);

/* Type to find (anywhere but the hollow field): names that contain the letters stay lit, the rest dim.
   The first match takes focus (a name that starts with them wins); Return opens it. */
let chipT = 0;
function hideChip() { chip.hidden = true; }
function setFind(q) {
  CK.q = q; const ql = q.trim().toLowerCase();
  CK.hits = ql ? CK.clusters.filter(c => c.a.name.toLowerCase().includes(ql)) : [];
  const hits = CK.hits;
  CK.clusters.forEach((c, i) => {
    const off = !!ql && !hits.includes(c);
    c.dimTo = off ? 1 : 0; c.lit = !!ql && !off;
    CK.btns[i].classList.toggle('dim', off);
  });
  if (!ql) { hideChip(); return; }
  chip.textContent = ''; chip.hidden = false;
  if (hits.length) {
    chip.textContent = 'Find · ' + q.charAt(0).toUpperCase() + q.slice(1);
    const best = hits.find(c => c.a.name.toLowerCase().startsWith(ql)) || hits[0], b = CK.btns[CK.clusters.indexOf(best)];
    b.classList.add('ring'); b.focus({ preventScroll: true });
  } else {
    // No one by that name: they're likely describing someone. Return makes them from this line.
    const ret = document.createElement('b'); ret.textContent = 'Return';
    chip.append(`No one called “${q}” · `, ret, ' · make a new agent');
    if (CK.btns.includes(document.activeElement)) document.activeElement.blur();
  }
}
addEventListener('keydown', e => {
  if (view !== 'home' || e.metaKey || e.ctrlKey || e.altKey || !CK.btns.length) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && CK.q) { e.preventDefault(); setFind(''); return; }
  if (e.key === 'Backspace' && CK.q) { e.preventDefault(); setFind(CK.q.slice(0, -1)); return; }
  if (e.key === 'Enter' && CK.q.trim() && !CK.hits.length) { e.preventDefault(); openMake({ line: CK.q.trim() }); return; }
  // Spaces count once a find has started (a description has them); before that, Space still presses the focused agent.
  if (e.key.length !== 1 || (e.key === ' ' && !CK.q)) return;
  e.preventDefault(); setFind(CK.q + e.key);
});

/* Keyboard order: → / ↓ clockwise (later), ← / ↑ counter-clockwise (earlier). Tab reaches the track, then the hollow. */
$('#home').addEventListener('keydown', e => {
  const i = CK.btns.indexOf(document.activeElement); if (i < 0) return;
  const n = CK.btns.length;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); CK.btns[(i + 1) % n].focus(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); CK.btns[(i + n - 1) % n].focus(); }
});

/* The hollow: type a line + Return, or bring a folder (drop and ⌘⇧N come from the core). */
function updateMk() {
  const v = mk.value.trim();
  if (v) mkHint.innerHTML = '<b>Return</b> · make a new agent';
  else mkHint.textContent = '';
}
mk.addEventListener('input', updateMk);
mk.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const v = mk.value.trim(); if (v) openMake({ line: v }); }
  else if (e.key === 'Escape') { mk.value = ''; updateMk(); }
});
$('#folderBtn').addEventListener('click', pickFolder);

start();
</script>
